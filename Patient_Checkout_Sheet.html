<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Post-op">

<title>Patient Checkout Sheet - Dr. Rolf</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #333; }
.header { background: #1B3A6B; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.header h1 { font-size: 20px; }
.header span { color: #E8A838; font-size: 13px; }
.container { max-width: 900px; margin: 18px auto; padding: 0 16px; }
.panel { background: #fff; border-radius: 8px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.section-title { font-size: 15px; font-weight: bold; color: #1B3A6B; border-bottom: 2px solid #E8A838; padding-bottom: 4px; margin: 18px 0 8px; }
.section-title small { font-weight: normal; color: #888; font-size: 12px; }
.section-title:first-child { margin-top: 0; }
/* Fixed two-column layout on wider screens (phones stay single-column) */
.formsec { margin-bottom: 14px; }
.formsec .section-title { margin-top: 0; }
.cols { display: flex; gap: 26px; align-items: flex-start; }
.col { flex: 1; min-width: 0; }
@media (max-width: 759px) { .cols { display: block; } }
.row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.field { flex: 1; min-width: 150px; }
.field label { display: block; font-size: 12px; color: #666; font-weight: bold; margin-bottom: 3px; }
.field input, .field select { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 14px; }
.chk input[type=checkbox] { width: 17px; height: 17px; accent-color: #1B3A6B; flex-shrink: 0; }
.chk .mini { width: 60px; padding: 2px 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; margin: 0 2px; }
.chk .mini.date { width: 110px; }
.btn-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { padding: 11px 22px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
.btn-primary { background: #1B3A6B; color: #fff; }
.btn-secondary { background: #E8A838; color: #1B3A6B; }
.btn-outline { background: #fff; color: #1B3A6B; border: 2px solid #1B3A6B; }
.copied-msg { display: none; color: #2E7D32; font-weight: bold; font-size: 14px; margin-left: 6px; }
.output-panel { display: none; background: #fff; border-radius: 8px; padding: 22px; margin-top: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.output-panel.active { display: block; }

/* Printable handout document */
.handout { background: #fff; color: #222; }
.doc-header { text-align: center; border-bottom: 3px solid #1B3A6B; padding-bottom: 8px; margin-bottom: 12px; }
.doc-practice { font-size: 20px; font-weight: bold; color: #1B3A6B; }
.doc-title { font-size: 15px; font-weight: bold; color: #333; margin-top: 2px; }
.doc-sub { font-size: 12px; color: #666; margin-top: 2px; }
.doc-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.doc-table td { border: 1px solid #d0d7e2; padding: 4px 8px; font-size: 12.5px; }
.doc-table td.k { background: #f0f4f8; color: #1B3A6B; font-weight: bold; width: 130px; }
.doc-sec { margin-bottom: 10px; }
.doc-sec h3 { font-size: 13px; color: #1B3A6B; border-bottom: 1px solid #E8A838; padding-bottom: 2px; margin-bottom: 4px; }
.doc-sec ul { margin: 0; padding-left: 20px; }
.doc-sec li { font-size: 12.5px; margin-bottom: 2px; }
.doc-warn h3 { color: #C62828; border-bottom-color: #C62828; }
.doc-warn p { font-size: 12.5px; }
.doc-footer { margin-top: 16px; padding-top: 8px; border-top: 1px solid #ccc; font-size: 12px; color: #555; }
.doc-contact { text-align: center; margin-top: 8px; padding-top: 8px; border-top: 2px solid #1B3A6B; font-size: 13px; font-weight: bold; color: #1B3A6B; }
.doc-contact .lbl { color: #555; font-weight: normal; }

.outblock { border: 1px solid #e2e6ee; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.outhead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-weight: bold; color: #1B3A6B; font-size: 15px; }
.outhead .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.provider { background: #fff; color: #222; }
[contenteditable]:focus { outline: 2px dashed #E8A838; outline-offset: 4px; }
/* embedded handout documents appended to the printable summary */
#hp-pages { margin-top: 14px; }
.hp-doc { border-top: 2px dashed #94a3b8; margin-top: 14px; padding-top: 12px; font-size: 12.5px; line-height: 1.55; color: #1e2a3a; }
.hp-doc .hp-head { text-align: center; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 3px solid #1B3A6B; position: relative; }
.hp-doc .hp-head:after { content: ""; position: absolute; left: 35%; right: 35%; bottom: -7px; height: 4px; background: #E8A838; border-radius: 2px; }
.hp-doc .hp-practice { font-size: 19px; font-weight: bold; color: #1B3A6B; letter-spacing: .4px; }
.hp-doc .hp-title { font-size: 15px; font-weight: bold; margin-top: 3px; }
.hp-doc .hp-sub { font-size: 11px; color: #667; margin-top: 2px; }
.hp-doc h3 { color: #1B3A6B; font-size: 13.5px; border-bottom: 2px solid #E8A838; padding-bottom: 2px; margin: 14px 0 6px; }
.hp-doc ul, .hp-doc ol { margin: 4px 0 8px 22px; }
.hp-doc li { margin-bottom: 3px; }
.hp-doc p { margin-bottom: 7px; }
.hp-doc table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; }
.hp-doc td { border: 1px solid #dbe3ef; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }
.hp-doc td:first-child { background: #f0f4f8; color: #1B3A6B; font-weight: bold; width: 30%; }
.hp-doc tr:nth-child(even) td:not(:first-child) { background: #fafbfd; }
.hp-doc .hp-foot { margin-top: 12px; padding-top: 6px; border-top: 2px solid #1B3A6B; text-align: center; font-weight: bold; color: #1B3A6B; font-size: 12px; }
@media print { .hp-doc { border-top: none; page-break-before: always; margin-top: 0; padding-top: 0; } .hp-doc table, .hp-doc h3 { page-break-inside: avoid; } }
@media print {
  body { background: #fff; }
  body.pp-provider * { visibility: hidden; }
  body.pp-provider #provider, body.pp-provider #provider * { visibility: visible; }
  body.pp-provider #provider { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
  body.pp-patient * { visibility: hidden; }
  body.pp-patient #handout, body.pp-patient #handout * { visibility: visible; }
  body.pp-patient #handout { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
}
</style>
</head>

<script id="handout-data">var HANDOUT_HTML = {"sh_tsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Total Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Damaged joint surfaces replaced with metal and plastic implants</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-2 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home the same day</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>25-30 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>Shoulder arthritis causes cartilage to wear down, leading to bone-on-bone contact, pain, and stiffness. When conservative treatments (therapy, injections, medications) no longer provide relief, Total Shoulder Replacement (TSA) restores smooth, pain-free motion by replacing the damaged ball and socket with artificial implants.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 25-30 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;25-30 lbs overhead), high-impact sports, and activities that risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Risks</h3>\n<p>Complications are rare but may include: infection, stiffness, implant loosening or wear over time, fractures around the implant, or incomplete pain relief. The benefits far outweigh the risks for most patients.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain 80% or more of their normal function with significant pain relief.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins within days of surgery and continues for 3-4 months to restore strength and motion.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>\u2705 DO</strong></td>\n<td><strong>\u274c DON\u2019T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_rsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Reverse Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Ball and socket reversed so the deltoid muscle powers the arm</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1.5-2.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home same day; overnight if needed</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>2-4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>10-15 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>When the rotator cuff is severely torn and not repairable, the shoulder loses stability and develops arthritis. A Reverse Shoulder Replacement flips the normal anatomy, placing a ball where the socket was and vice versa, allowing the deltoid muscle to compensate for the missing rotator cuff. <strong>Common reasons:</strong> irreparable cuff tear with arthritis, failed previous replacement, complex fractures, severe arthritis with instability.</p>\n<p><strong>How is this different from a standard replacement?</strong> A standard replacement requires a functioning rotator cuff. A reverse swaps the ball and socket, allowing the deltoid to power the arm when the cuff is too damaged to repair.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 10-15 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;10-15 lbs overhead), high-impact sports, and activities that risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Longevity &amp; Risks</h3>\n<p>91-94% of implants survive 10+ years; 84-87% at 15 years. Rare risks include: infection, dislocation, nerve injury, component loosening, acromion fracture, or revision surgery.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain significant function and pain relief. The deltoid does the work the rotator cuff no longer can.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins 2-3 days after surgery and continues for 3-4 months.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>\u2705 DO</strong></td>\n<td><strong>\u274c DON\u2019T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Questions? 513-354-3700 | teamrolf@beaconortho.com | www.DoctorRolf.com</h3>\n<p><em>Refs: Grubhofer et al. JSES 2016. Young et al. JBJS 2020. Smith et al. JSES 2024.</em></p>\n", "sh_rcr": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Repair</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A partial or complete tear of one or more rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Rotator Cuff Tears</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>\u2022 Degenerative: gradual wear over time (most common)</p>\n<p>\u2022 Traumatic: from a fall, lifting, or sudden injury</p>\n<p>\u2022 Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>\u2022 Partial-thickness: tendon is damaged but not torn through</p>\n<p>\u2022 Full-thickness (small): &lt;1 cm tear</p>\n<p>\u2022 Full-thickness (large): 1-3 cm tear</p>\n<p>\u2022 Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Aching at the top or side of the shoulder</p>\n<p>\u2022 Pain worse at night, especially lying on that side</p>\n<p>\u2022 Sharp pain with overhead motions</p>\n<p>\u2022 Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness lifting or rotating the arm</p>\n<p>\u2022 Difficulty reaching behind back (bra strap, belt)</p>\n<p>\u2022 Arm feels heavy or fatigued</p>\n<p>\u2022 Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all rotator cuff tears require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>\u2022 Physical therapy to strengthen surrounding muscles</p>\n<p>\u2022 Anti-inflammatory medications (oral or topical)</p>\n<p>\u2022 Cortisone injection for pain relief</p>\n<p>\u2022 Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>\u2022 Arthroscopic rotator cuff repair (most common)</p>\n<p>\u2022 Mini-open repair for larger tears</p>\n<p>\u2022 Tendon transfer or superior capsular reconstruction</p>\n<p>\u2022 Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_faq": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Surgery FAQ</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><h3>Frequently Asked Questions</h3>\n<p>About Shoulder Surgery</p>\n<h3>What Will My Restrictions Be After Surgery?</h3>\n<p>Your post-operative restrictions depend on the type of shoulder surgery performed. Follow these guidelines to ensure proper healing:</p>\n<h3>Rotator Cuff Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Total Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>25-30 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>Labral Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Reverse Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>6-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>10-15 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>When Can I Return to Work?</h3>\n<blockquote>\n<p>\u2022 Most patients can return to work the week after surgery, depending on their job duties.</p>\n<p>\u2022 Review the post-operative restrictions above with your employer to determine when you can safely resume work.</p>\n<p>\u2022 If your employer requires work restriction notes, we can provide them via email or fax upon request.</p>\n<p>\u2022 If your job requires lifting beyond your restrictions, your employer may either keep you off work or modify your job duties accordingly.</p>\n</blockquote>\n<h3>Will I Need Physical Therapy After Surgery?</h3>\n<p>Yes, physical therapy is required for all shoulder surgery to ensure proper recovery.</p>\n<blockquote>\n<p>\u2022 <strong>First PT Visit:</strong> 2 days after surgery for a dressing change and incision check.</p>\n</blockquote>\n<h3>Shoulder Replacements:</h3>\n<blockquote>\n<p>\u2022 PT twice a week for 6 weeks.</p>\n<p>\u2022 Then transition to once a week or every other week until 3-4 months after surgery.</p>\n</blockquote>\n<h3>Shoulder Repairs:</h3>\n<blockquote>\n<p>\u2022 Attend initial PT visit.</p>\n<p>\u2022 Return in 2-4 weeks, depending on the extent of the repair.</p>\n<p>\u2022 Your therapy schedule will be outlined on your PT script, provided on the day of surgery.</p>\n</blockquote>\n<h3>When Can I Return to Golf After Shoulder Surgery?</h3>\n<p>Your return to golf will depend on the type of shoulder surgery performed and your progress in rehabilitation.</p>\n<h3>Rotator Cuff Repair</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Total Shoulder Replacement</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~5-6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Labral Repair</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Reverse Shoulder Replacement</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~5-6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_instab": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Instability Surgery (Labral / Bankart Repair)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Arthroscopic reattachment of the torn labrum to the socket rim with suture anchors</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-1.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>6 weeks</td>\n</tr>\n<tr>\n<td><strong>Return to Contact Sports</strong></td>\n<td>Approximately 6 months with surgeon clearance</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>When the shoulder dislocates, the labrum (the cartilage rim that deepens the socket) tears away from the bone, most often at the front (a Bankart tear). Once torn, the labrum does not reliably heal in place, and each dislocation stretches the capsule and raises the risk of the next one, especially in young, active patients. Surgery reattaches the labrum with small suture anchors and re-tensions the capsule to restore stability.</p>\n<h3>What May Be Done at Surgery</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Core Repair</h3>\n<p>&bull; Arthroscopic Bankart (labral) repair with suture anchors</p>\n<p>&bull; Capsular tightening (plication) as needed</p>\n<p>&bull; Posterior labral repair if the tear extends backward</p>\n</td>\n<td><h3>Additions When Needed</h3>\n<p>&bull; Remplissage: filling a Hill-Sachs dent in the ball to stop it from catching</p>\n<p>&bull; Bone augmentation (e.g., Latarjet) for significant socket bone loss</p>\n<p>&bull; Biceps/SLAP treatment when the tear involves the biceps anchor</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-6</td>\n<td>Sling; gentle prescribed motion only; avoid reaching out and away from the body</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 6-12</td>\n<td>Out of sling; progressive motion; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 3-6</td>\n<td>Strength program; 10-lb limit; sport-specific training</td>\n</tr>\n<tr>\n<td>Return to Sport</td>\n<td>6+ months</td>\n<td>Contact and overhead sports with surgeon clearance</td>\n</tr>\n</tbody>\n</table><h3>First 6 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Why fix it instead of rehabbing it?</h3>\n<blockquote>\n<p>In young, active patients the redislocation rate with therapy alone is high, and every dislocation can damage more cartilage and bone. Repair dramatically lowers the recurrence risk and protects the joint long-term.</p>\n</blockquote>\n<h3>Q: What is remplissage?</h3>\n<blockquote>\n<p>Large dislocations can dent the back of the ball (a Hill-Sachs lesion). Remplissage stitches tissue into the dent so it can no longer catch on the socket rim, further reducing the redislocation risk. It is done arthroscopically at the same time as the labral repair.</p>\n</blockquote>\n<h3>Q: Will I lose motion?</h3>\n<blockquote>\n<p>A small loss of extreme external rotation is possible, which matters mainly to throwers. For most patients the trade for a stable shoulder is well worth it, and therapy restores functional motion.</p>\n</blockquote>\n<h3>Q: When can I return to contact sports?</h3>\n<blockquote>\n<p>Typically around 6 months, once strength and control match the other side and your surgeon clears you. Returning early is the most common cause of re-injury.</p>\n</blockquote>\n<h3>Q: What if I dislocate again after surgery?</h3>\n<blockquote>\n<p>Recurrence after repair is uncommon but possible, especially with early return to contact sports or significant bone loss. A recurrent dislocation is evaluated with imaging, and revision options, including bone augmentation procedures, are very effective.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_imp": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Impingement Surgery (Arthroscopic Subacromial Decompression)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Arthroscopic removal of inflamed bursa and bone spurs that pinch the rotator cuff</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 30-60 minutes</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>A few days to 2 weeks, for comfort only</td>\n</tr>\n<tr>\n<td><strong>Return to Full Activity</strong></td>\n<td>Most patients by 2-3 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The rotator cuff glides beneath the acromion (the bony roof of the shoulder), cushioned by a bursa. With impingement, bone spurs and a thickened, inflamed bursa pinch the cuff every time the arm is raised. Most patients improve with therapy and injections; surgery is for those whose symptoms persist despite good conservative care. Through small arthroscopic portals, the inflamed bursa is removed and the undersurface of the acromion is smoothed (acromioplasty) to give the cuff room to glide.</p>\n<h3>What May Be Done at Surgery</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Core Procedure</h3>\n<p>&bull; Diagnostic arthroscopy of the joint</p>\n<p>&bull; Bursectomy (removal of the inflamed bursa)</p>\n<p>&bull; Acromioplasty (smoothing the bone spur)</p>\n</td>\n<td><h3>Additions When Needed</h3>\n<p>&bull; Distal clavicle resection for AC joint arthritis</p>\n<p>&bull; Debridement of partial cuff fraying</p>\n<p>&bull; Biceps treatment if the biceps is involved</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Comfort</td>\n<td>Days 0-14</td>\n<td>Sling for comfort only; motion starts right away</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 2-6</td>\n<td>Full motion is the goal; PT and home program</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>Progressive cuff and scapular strengthening</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>2-3 months</td>\n<td>Return to overhead work and sport as symptoms allow</td>\n</tr>\n</tbody>\n</table><h3>First 2 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Why is recovery faster than a rotator cuff repair?</h3>\n<blockquote>\n<p>Nothing is sewn that must heal under protection. Since only inflamed tissue and bone spur are removed, you can move the shoulder immediately, and recovery is driven by comfort rather than tendon healing.</p>\n</blockquote>\n<h3>Q: Will the spur grow back?</h3>\n<blockquote>\n<p>Recurrence of a symptomatic spur is uncommon. Keeping the cuff and shoulder blade muscles strong is the best protection against symptoms returning.</p>\n</blockquote>\n<h3>Q: What if a cuff tear is found during surgery?</h3>\n<blockquote>\n<p>The shoulder is fully inspected during arthroscopy. If a significant tear is found, it is addressed, which can change the rehab plan. This is discussed with you before surgery as a possibility.</p>\n</blockquote>\n<h3>Q: When can I go back to work?</h3>\n<blockquote>\n<p>Desk work: a few days to a week. Light physical work: 2-4 weeks. Heavy or overhead labor: usually 6-12 weeks depending on demands.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_bt": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Biceps Tenodesis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The worn biceps tendon is detached from inside the joint and anchored to the humerus</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 45-90 minutes, often with arthroscopy</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>About 4 weeks</td>\n</tr>\n<tr>\n<td><strong>Return to Full Activity</strong></td>\n<td>Approximately 3-4 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The long head of the biceps runs through the shoulder joint and anchors to the top of the socket. It is a common source of deep, aching front-of-shoulder pain when it becomes inflamed, partially torn, or unstable in its groove, and it is frequently involved with SLAP tears and rotator cuff disease. A tenodesis detaches the worn portion from inside the joint and secures the healthy tendon to the humerus, removing the pain generator while preserving biceps strength and contour.</p>\n<h3>Tenodesis vs. Tenotomy</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Tenodesis (reattachment)</h3>\n<p>&bull; Tendon is anchored to the bone</p>\n<p>&bull; Preserves strength and muscle contour</p>\n<p>&bull; Requires ~4 weeks of protection</p>\n<p>&bull; Preferred in younger, active patients</p>\n</td>\n<td><h3>Tenotomy (release only)</h3>\n<p>&bull; Tendon is simply released</p>\n<p>&bull; Faster recovery, no repair to protect</p>\n<p>&bull; Small risk of a cosmetic \"Popeye\" bulge</p>\n<p>&bull; Often chosen in older, lower-demand patients</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-4</td>\n<td>Sling; no active elbow curling against resistance</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 4-6</td>\n<td>Out of sling; restore full shoulder and elbow motion</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>Progressive strengthening, including gentle biceps work</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>3-4 months</td>\n<td>Return to lifting and sport</td>\n</tr>\n</tbody>\n</table><h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will my biceps be weaker?</h3>\n<blockquote>\n<p>No meaningful weakness is expected after a healed tenodesis. The tendon is fixed securely to bone in a position that maintains normal biceps tension.</p>\n</blockquote>\n<h3>Q: Why not just repair the SLAP tear?</h3>\n<blockquote>\n<p>In adults beyond their athletic twenties, tenodesis is more reliable than SLAP repair, with faster recovery, less stiffness, and more predictable pain relief. It treats the same pain source at its origin.</p>\n</blockquote>\n<h3>Q: What restrictions matter most early on?</h3>\n<blockquote>\n<p>Avoid lifting with the arm and avoid resisted elbow curls for the first 6 weeks, so the tendon heals securely to the bone before it is loaded.</p>\n</blockquote>\n<h3>Q: Is it usually done alone?</h3>\n<blockquote>\n<p>Often it is combined with other arthroscopic work, such as a rotator cuff repair or decompression. When combined, the more restrictive protocol of the two procedures guides your rehab.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_clav": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Clavicle Fracture Surgery (ORIF)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The broken collarbone is realigned and fixed with a plate and screws</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-1.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>2-4 weeks for comfort</td>\n</tr>\n<tr>\n<td><strong>Bone Healing</strong></td>\n<td>6-12 weeks; return to contact sports usually 3-4 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>Many clavicle fractures heal well in a sling. Surgery is recommended when the fragments are significantly shortened or displaced, when the skin is tented at risk, in open fractures, or in higher-demand patients where a faster, more predictable recovery and restored shoulder mechanics matter. Fixation realigns the bone to its normal length and holds it with a contoured plate and screws while it heals.</p>\n<h3>Benefits and Trade-offs</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Benefits of Fixation</h3>\n<p>&bull; Restores normal length and alignment</p>\n<p>&bull; Earlier motion and use of the arm</p>\n<p>&bull; Lower nonunion rate for displaced fractures</p>\n<p>&bull; Predictable return for athletes and laborers</p>\n</td>\n<td><h3>Trade-offs</h3>\n<p>&bull; A scar over the collarbone</p>\n<p>&bull; A patch of numbness below the incision is common</p>\n<p>&bull; Hardware can be prominent under the skin</p>\n<p>&bull; Plate removal is an option after full healing if it bothers you</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-2</td>\n<td>Sling for comfort; gentle motion begins early</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 2-6</td>\n<td>Progressive shoulder motion; light daily use of the arm</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>X-rays confirm healing; progressive strengthening</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>3-4 months</td>\n<td>Contact sports after healed X-rays and full strength</td>\n</tr>\n</tbody>\n</table><h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will the plate stay in forever?</h3>\n<blockquote>\n<p>It can. The plate does not need to be removed unless it bothers you. If it is prominent or irritating, it can be removed with a short outpatient procedure after the bone is solidly healed, usually no sooner than 6-12 months.</p>\n</blockquote>\n<h3>Q: Why is part of my chest numb?</h3>\n<blockquote>\n<p>Small skin nerves cross the incision and some numbness below the scar is common. It usually shrinks over months and rarely causes functional problems.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>When you are out of the sling, off narcotic medication, and can control the wheel comfortably, often around 2-4 weeks.</p>\n</blockquote>\n<h3>Q: What are the main risks?</h3>\n<blockquote>\n<p>Infection, hardware irritation, numbness around the scar, and rarely nonunion or the need for further surgery. Not smoking and following the rehab plan are the best things you can do for healing.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_ph": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Proximal Humerus Fracture Surgery (ORIF)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The broken upper arm bone is realigned and fixed with a locking plate and screws</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1.5-2.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Same day or one-night stay</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>4-6 weeks</td>\n</tr>\n<tr>\n<td><strong>Recovery</strong></td>\n<td>Bone heals by ~12 weeks; strength and motion continue improving up to a year</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The proximal humerus is the ball portion of the shoulder. Many of these fractures heal without surgery, but when the fragments are significantly displaced or the ball has split, fixation restores the anatomy so the shoulder can regain motion and strength. A locking plate holds the fragments while the bone heals; in severe patterns in older patients, replacement (usually a reverse shoulder) can be the more reliable choice, and this is discussed before surgery.</p>\n<h3>What Affects the Plan</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Favoring Fixation (ORIF)</h3>\n<p>&bull; Good bone quality</p>\n<p>&bull; Fracture pieces can be realigned and held</p>\n<p>&bull; Younger or higher-demand patients</p>\n<p>&bull; Ball has a good blood supply</p>\n</td>\n<td><h3>Favoring Replacement Instead</h3>\n<p>&bull; Severely fragmented ball or poor bone</p>\n<p>&bull; Fracture-dislocations in older patients</p>\n<p>&bull; Pre-existing rotator cuff failure or arthritis</p>\n<p>&bull; Patterns with high risk of the ball losing blood supply</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-2</td>\n<td>Sling; pendulum exercises and hand/wrist/elbow motion</td>\n</tr>\n<tr>\n<td>Early Motion</td>\n<td>Weeks 2-6</td>\n<td>Gentle assisted motion as X-rays confirm the fixation is holding</td>\n</tr>\n<tr>\n<td>Active Motion</td>\n<td>Weeks 6-12</td>\n<td>Sling weaned; active motion progresses; light use of the arm</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 3-6+</td>\n<td>Strengthening once healed; function improves up to a year</td>\n</tr>\n</tbody>\n</table><h3>First 6 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will my shoulder be stiff?</h3>\n<blockquote>\n<p>Some stiffness is the most common issue after this fracture, with or without surgery. Early guided motion and consistent therapy are the best defense, and most patients regain very functional motion.</p>\n</blockquote>\n<h3>Q: Why do I need so many X-rays?</h3>\n<blockquote>\n<p>Follow-up X-rays confirm the fragments and hardware are holding position while the bone heals and catch problems early, when they are easiest to address.</p>\n</blockquote>\n<h3>Q: What is avascular necrosis?</h3>\n<blockquote>\n<p>In some fracture patterns the blood supply to the ball is damaged, and part of it can slowly collapse over months to years. If that occurs and causes pain, conversion to a shoulder replacement is an effective solution.</p>\n</blockquote>\n<h3>Q: Will the plate need to come out?</h3>\n<blockquote>\n<p>Usually not. Removal is reserved for hardware that irritates or a screw that becomes prominent, and only after the bone is fully healed.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>"};</script>

  'Superior capsular reconstruction',
  'Distal biceps repair',
  'Clavicle ORIF',
  'Proximal humerus ORIF',
  'Shoulder arthroscopy (diagnostic)',
  'Manipulation under anesthesia'
];

// ---------- rendering ----------
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function labelHtml(item) {
  // Build the on-screen label with inline inputs replacing {tokens}
  var html = esc(item.tpl);
  (item.inputs || []).forEach(function(inp) {
    var cls = 'mini' + (inp.date ? ' date' : '');
    var field = '<input class="' + cls + '" id="' + item.id + '_' + inp.k + '" size="' + inp.size + '">';
    html = html.replace('{' + inp.k + '}', field);
  });
  // restore degree symbol if escaped (it wasn't) - leave as-is
  return html;
}

function renderForm() {
  var root = document.getElementById('form-root');
  var html = '';
  var RIGHT = { 'Wound / Incision Care':1, 'Ice / Swelling':1, 'Medications':1, 'Driving / Work':1 };
  var colL = '', colR = '';
  SECTIONS.forEach(function(sec, si) {
    var s = '<div class="formsec"><div class="section-title">' + esc(sec.title) + (sec.note ? ' <small>(' + esc(sec.note) + ')</small>' : '') + '</div>';
    sec.items.forEach(function(item) {
      var onch = sec.chooseOne ? ' onchange="soloCheck(' + si + ',\'' + item.id + '\')"' : '';
      s += '<label class="chk"><input type="checkbox" id="chk_' + item.id + '"' + onch + '><span>' + labelHtml(item) + '</span></label>';
    });
    s += '</div>';
    if (RIGHT[sec.title]) colR += s; else colL += s;
  });
  root.innerHTML = '<div class="cols"><div class="col">' + colL + '</div><div class="col">' + colR + '</div></div>';

  var fu = document.getElementById('fu-intervals');
  var ih = '<div style="font-size:12px;color:#666;font-weight:bold;margin:4px 0;">Interval</div><div style="display:flex;flex-wrap:wrap;gap:6px 16px;">';
  INTERVALS.forEach(function(v, i) {
    ih += '<label class="chk" style="padding:2px"><input type="checkbox" id="fu_' + i + '"><span>' + esc(v) + '</span></label>';
  });
  ih += '</div>';
  fu.innerHTML = ih;
}

// In a "choose one" section, checking one clears the others
function soloCheck(si, id) {
  var box = document.getElementById('chk_' + id);
  if (!box.checked) return;
  SECTIONS[si].items.forEach(function(item) {
    if (item.id !== id) { var o = document.getElementById('chk_' + item.id); if (o) o.checked = false; }
  });
}

function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

// ---------- procedure dropdown ----------
function initProcedures() {
  var s = document.getElementById('p-proc-sel'); if (!s) return;
  var h = '<option value="">— select procedure —</option>';
  PROCEDURES.forEach(function(p) { h += '<option value="' + esc(p) + '">' + esc(p) + '</option>'; });
  h += '<option value="__other__">Other (type below)…</option>';
  s.innerHTML = h;
}
// Show the free-text box only when "Other" is chosen
function onProcChange() {
  var sel = document.getElementById('p-proc-sel'), txt = document.getElementById('p-proc');
  if (sel.value === '__other__') { txt.style.display = 'block'; try { txt.focus(); } catch (e) {} }
  else { txt.style.display = 'none'; txt.value = ''; }
  // if a post-op visit is already chosen, re-apply so the plan matches the new procedure
  var vs = document.getElementById('co-preset-select');
  if (vs && vs.value !== '') applyPresetCO(parseInt(vs.value, 10));
}
// Resolve the chosen procedure: dropdown value, or the typed value when "Other"
function procValue() {
  var sel = document.getElementById('p-proc-sel');
  if (!sel) return v('p-proc');
  if (sel.value === '__other__') return v('p-proc');
  return sel.value;
}

// Fill {tokens} in a template with input values (blank -> underline)
function fillTpl(item) {
  var t = item.tpl;
  (item.inputs || []).forEach(function(inp) {
    var val = v(item.id + '_' + inp.k);
    t = t.replace('{' + inp.k + '}', val || '______');
  });
  return t;
}

// ---------- generate ----------
function generate() {
  var side = v('p-side') || document.getElementById('p-side').value;
  var rows = [
    ['Patient', v('p-name') || '—'],

    h += '<div class="doc-sec"><h3>' + esc(sec.title) + '</h3><ul>';

// Concise provider note (to paste into Athena) from the same selections.
function buildProvider() {
  var proc = procValue() || '—';
  var side = v('p-side') || document.getElementById('p-side').value;
  var dos = v('p-dos');
  var vsel = document.getElementById('co-preset-select');
  var visitLabel = (vsel && vsel.value !== '') ? vsel.options[vsel.selectedIndex].text : '';

  var items = [];
  SECTIONS.forEach(function(sec) {
    sec.items.forEach(function(item) {
      var c = document.getElementById('chk_' + item.id);
      if (c && c.checked) items.push(fillTpl(item));
    });
  });

  var ints = [];
  INTERVALS.forEach(function(val, i) { var c = document.getElementById('fu_' + i); if (c && c.checked) ints.push(val); });
  var fuBits = [];
  if (fuForVal) fuBits.push(fuForVal);
  if (ints.length) fuBits.push('return ' + ints.map(function(v){ return /^(after|as)/.test(v) ? v : 'in ' + v; }).join(', '));

  var h = '<div class="doc-header"><div class="doc-practice">Provider Note</div>';
  h += '<div class="doc-sub">' + esc(v('p-name') || '[patient]') + (v('p-dob') ? ' &middot; DOB ' + esc(v('p-dob')) : '') + (v('p-date') ? ' &middot; ' + esc(v('p-date')) : '') + ' &middot; Robert H. Rolf, MD</div></div>';
  var sp = 'S/P ' + esc(proc) + ' (' + esc(side) + ')';
  if (dos) sp += ', DOS ' + esc(dos);
  if (visitLabel) sp += ' &mdash; ' + esc(visitLabel);
  h += '<div class="doc-sec"><p>' + sp + '.</p></div>';
  if (items.length) {
    h += '<div class="doc-sec"><h3>Plan</h3><ul>';
    items.forEach(function(t) { h += '<li>' + esc(t) + '</li>'; });
    h += '</ul></div>';
  }
  if (fuBits.length) h += '<div class="doc-sec"><h3>Follow-up</h3><p>' + esc(fuBits.join('; ')) + '.</p></div>';
  document.getElementById('provider').innerHTML = h;
}

// ---------- copy / print / clear ----------
function copyDoc() {
  var text = document.getElementById('handout').innerText;
  var done = function() { var m = document.getElementById('copy-msg'); if (m) { m.style.display = 'inline'; setTimeout(function() { m.style.display = 'none'; }, 2000); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function copyProvider() {
  var text = document.getElementById('provider').innerText;
  var done = function() { var m = document.getElementById('copy-msg-p'); if (m) { m.style.display = 'inline'; setTimeout(function() { m.style.display = 'none'; }, 2000); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function() { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
}
function printAs(cls) { document.body.classList.add(cls); window.print(); document.body.classList.remove(cls); }
function printPatient() { printAs('pp-patient'); }
function printProvider() { printAs('pp-provider'); }

function clearAll() {
  document.querySelectorAll('#form-root input, #fu-intervals input').forEach(function(el) {
    if (el.type === 'checkbox') el.checked = false; else el.value = '';
  });
  ['p-name','p-dob','p-dos','p-proc'].forEach(function(id){ document.getElementById(id).value=''; });
  fuForVal = '';
  document.getElementById('p-side').selectedIndex = 0;
  document.getElementById('p-proc-sel').selectedIndex = 0;
  document.getElementById('co-preset-select').selectedIndex = 0;
  onProcChange();
  setToday();
  document.getElementById('output-panel').classList.remove('active');
}

function setToday() {
  var d = new Date();
  document.getElementById('p-date').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// ---------- post-op presets (procedure-aware, full per-track plans) ----------
/* Pick Procedure + post-op visit -> the plan fills in. Each procedure maps to a
   track; each track defines First / 6 weeks / 3 months / 6 months.
   fu is an interval LABEL, resolved to a checkbox index against INTERVALS. */

var PROC_TRACK = {
  'Rotator cuff repair': 'cuff',
  'Rotator cuff repair with biceps tenodesis': 'cuff',
  'Superior capsular reconstruction': 'cuff',
  'Anatomic total shoulder arthroplasty': 'tsa',
  'Reverse total shoulder arthroplasty': 'rsa',
  'Labral / Bankart repair': 'instab',
  'SLAP repair': 'instab',
  'Distal biceps repair': 'dbiceps',
  'Clavicle ORIF': 'fracture',
  'Proximal humerus ORIF': 'fracture',
  'Subacromial decompression / acromioplasty': 'soft',
  'Biceps tenodesis': 'soft',
  'Distal clavicle resection (Mumford)': 'soft',
  'Shoulder arthroscopy (diagnostic)': 'soft',
  'Manipulation under anesthesia': 'mua'
};
function currentTrack() {
  var sel = document.getElementById('p-proc-sel');
  return (sel && PROC_TRACK[sel.value]) ? PROC_TRACK[sel.value] : 'cuff';
}

// Added to EVERY track's FIRST visit (your always-adds): wound care, ice,
// aspirin 81 mg twice daily x4 wks, no driving in sling/on narcotics, work note.
var FIRST_COMMON = [
  {id:'wc1'}, {id:'wc3'}, {id:'ice1'},
  {id:'md3', inputs:{mg:'81', freq:'twice daily', w:'4'}},
  {id:'dw1'}, {id:'dw3'}
];

// Per-track plans. checks = items to check; fu = next-visit interval label;
// xray = add "X-ray" as the follow-up reason.
var TRACK_PLANS = {
  cuff: {
    first:{ checks:[{id:'sl1'},{id:'rom6'}], fu:'6 weeks' },
    wk6:  { checks:[{id:'sl4'},{id:'lf1',inputs:{lbs:'5'}},{id:'pt1'}], fu:'3 months' },
    mo3:  { checks:[{id:'rom7'},{id:'pt3'}], fu:'6 months' },

  },
  tsa: {
    first:{ checks:[{id:'sl2',inputs:{w:'2–4'}},{id:'rom6'}], fu:'6 weeks', xray:true },
    wk6:  { checks:[{id:'sl4'},{id:'lf1',inputs:{lbs:'5'}},{id:'pt1'}], fu:'3 months', xray:true },
    mo3:  { checks:[{id:'rom7'},{id:'pt3'}], fu:'6 months', xray:true },
    mo6:  { checks:[{id:'lf2',inputs:{lbs:'30'}},{id:'pt4'}], fu:'5 years', xray:true }
  },
  rsa: {
    first:{ checks:[{id:'sl2',inputs:{w:'4–6'}},{id:'rom6'},{id:'rbb'},{id:'pt5'}], fu:'6 weeks', xray:true },
    wk6:  { checks:[{id:'sl4'},{id:'lf1',inputs:{lbs:'5'}},{id:'pt1'},{id:'pt6'}], fu:'3 months', xray:true },
    mo3:  { checks:[{id:'rom7'},{id:'pt3'}], fu:'6 months', xray:true },
    mo6:  { checks:[{id:'lf2',inputs:{lbs:'15'}},{id:'pt4'}], fu:'5 years', xray:true }
  },
  instab: {
    first:{ checks:[{id:'sl1'},{id:'rom6'}], fu:'6 weeks' },
    wk6:  { checks:[{id:'sl4'},{id:'lf1',inputs:{lbs:'5'}},{id:'pt1'}], fu:'3 months' },
    mo3:  { checks:[{id:'rom7'},{id:'pt3'}], fu:'6 months' },
    mo6:  { checks:[{id:'actf'},{id:'pt4'}], fu:'as needed' }
  },
  dbiceps: {
    first:{ checks:[{id:'sl1'},{id:'act0'}], fu:'2 weeks' },
    wk6:  { checks:[{id:'sl4'},{id:'lf1',inputs:{lbs:'5'}},{id:'pt1'}], fu:'3 months' },
    mo3:  { checks:[{id:'rom7'},{id:'pt3'}], fu:'6 months' },

  },

    mo6:  { checks:[{id:'actf'},{id:'pt4'}], fu:'as needed' }
  }
};

var VISIT_KEYS = ['first','wk6','mo3','mo6'];
var VISIT_LABELS = ['First post-op visit', '6 weeks', '3 months', '6 months'];

function initCOPresets(){
  var s=document.getElementById('co-preset-select'); if(!s) return;
  var h='<option value="">— choose post-op visit to auto-fill —</option>';
  VISIT_LABELS.forEach(function(lbl,i){ h+='<option value="'+i+'">'+lbl+'</option>'; });
  s.innerHTML=h;
}

function applyPresetCO(idx){
  // clear everything the presets touch
  document.querySelectorAll('#form-root input[type=checkbox]').forEach(function(c){ c.checked=false; });
  document.querySelectorAll('#form-root input:not([type=checkbox])').forEach(function(i){ i.value=''; });
  document.querySelectorAll('#fu-intervals input[type=checkbox]').forEach(function(c){ c.checked=false; });
  fuForVal='';

  var track=currentTrack();
  var plan=(TRACK_PLANS[track]||TRACK_PLANS.cuff)[VISIT_KEYS[idx]];
  if(!plan) return;

  // first visit also gets the universal always-add items
  var checks=(idx===0 ? FIRST_COMMON.slice() : []).concat(plan.checks||[]);
  checks.forEach(function(ck){
    var box=document.getElementById('chk_'+ck.id); if(box) box.checked=true;
    if(ck.inputs){ Object.keys(ck.inputs).forEach(function(k){ var inp=document.getElementById(ck.id+'_'+k); if(inp) inp.value=ck.inputs[k]; }); }
  });

  // follow-up interval (by label) + optional X-ray reason
  if(plan.fu){ var fi=INTERVALS.indexOf(plan.fu); if(fi>=0){ var f=document.getElementById('fu_'+fi); if(f) f.checked=true; } }
  if(plan.xray){ fuForVal='X-ray'; }
}

// ---------- init ----------
renderForm();
initCOPresets();
initProcedures();
setToday();
