<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clinical Tools — Dr. Rolf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rolf Tools">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         background: #f0f4f8; color: #1e2a3a; min-height: 100vh; }
  .header { background: #1B3A6B; color: #fff; padding: 22px 20px calc(22px + env(safe-area-inset-top));
            padding-top: max(22px, env(safe-area-inset-top)); text-align: center; }
  .header h1 { font-size: 21px; letter-spacing: .3px; }
  .header .sub { color: #E8A838; font-size: 13px; margin-top: 3px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 520px){ .grid { grid-template-columns: 1fr 1fr; } }
  a.card { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
           background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 16px;
           box-shadow: 0 1px 3px rgba(27,58,107,.06); transition: transform .08s, box-shadow .12s; }
  a.card:active { transform: scale(.98); box-shadow: 0 1px 2px rgba(27,58,107,.12); }
  .ic { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 11px; background: #1B3A6B;
        color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;
        font-size: 18px; position: relative; }
  .ic::after { content: ""; position: absolute; bottom: 10px; left: 12px; right: 12px; height: 3px;
               border-radius: 2px; background: #E8A838; }
  .t-title { font-size: 16px; font-weight: 700; }
  .t-desc { font-size: 12.5px; color: #64748b; margin-top: 2px; line-height: 1.3; }
  .note { margin-top: 22px; font-size: 12px; color: #7b8794; text-align: center; line-height: 1.5; }
  .foot { margin-top: 18px; text-align: center; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="header">
    <div style="display:flex;justify-content:center;margin-bottom:6px;"><svg width="58" height="55" viewBox="0 0 1050 1000" aria-label="Team Rolf logo" style="flex:0 0 auto;">
<g fill="none" stroke="#ffffff" stroke-linecap="round">
<path d="M 300 980 C 308 780 298 640 315 545 C 322 480 298 452 300 390 C 302 305 355 258 428 262 C 500 266 542 318 536 390 C 532 442 508 462 502 512" stroke-width="34"/>
<path d="M 428 980 C 432 820 436 700 428 620 C 470 570 480 540 502 512" stroke-width="30"/>
<path d="M 560 470 C 590 560 640 700 700 880 C 760 780 820 620 872 470" stroke-width="34"/>
<path d="M 872 470 C 885 415 890 370 880 330" stroke-width="34"/>
<path d="M 560 470 C 552 430 556 400 575 372" stroke-width="34"/>
<path d="M 430 190 C 560 150 760 175 1000 240" stroke-width="32"/>
<path d="M 470 232 C 600 196 780 220 990 285" stroke-width="26"/>
<path d="M 340 250 C 360 205 420 185 470 205" stroke-width="30"/>
<path d="M 545 320 C 560 292 610 282 645 300 C 668 313 664 338 638 346 C 605 355 565 348 548 335" stroke-width="26"/>
</g>
<circle cx="700" cy="560" r="60" fill="#E8A838"/>
</svg></div>
    <h1>Clinical Tools</h1>
    <div class="sub">Robert H. Rolf, MD &middot; Beacon Orthopaedics</div>
  </div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="note">Tap a tool to open it. To make one its own app icon: open it, tap the
      <strong>Share</strong> button, then <strong>Add to Home Screen</strong>.</div>
    <div class="foot">Works offline once opened. Team Rolf &middot; doctorrolf.com</div>
  </div>
<script>
  var TOOLS = [
    ["Plan_Sheet.html",            "Plan",     "Plan Sheet",      "Visit plan + patient summary"],
    ["Surgery_Booking_Form.html",  "Book",     "Surgery Booking", "Booking form for staff"],
    ["Op_Report_Generator_Coded.html", "Op$",  "Op Report + Codes","Op note with CPT/ICD codes listed"],
    ["Clinic_Encounter_Sheet.html","Clin",     "Clinic Encounter","New / established / follow-up + patient handout"],
    ["Patient_Checkout_Sheet.html","Post",     "Post-op Encounter","Post-op provider note + patient handout"],
    ["Op_Report_Generator.html",   "Op",       "Op Report",       "Operative note to paste into Athena"],
    ["Billing_Coder.html",         "Bill",     "Billing Coder",   "Diagnosis & procedure codes"]
  ];
  var g = document.getElementById("grid");
  TOOLS.forEach(function(t){
    var a = document.createElement("a");
    a.className = "card"; a.href = t[0];
    a.innerHTML = '<div class="ic">'+t[1]+'</div><div><div class="t-title">'+t[2]+
                  '</div><div class="t-desc">'+t[3]+'</div></div>';
    g.appendChild(a);
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
