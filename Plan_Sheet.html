<title>Plan Sheet - Dr. Rolf</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; color: #333; }
.header { background: #1B3A6B; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.header h1 { font-size: 20px; }
.header span { color: #E8A838; font-size: 13px; }
.container { max-width: 1000px; margin: 18px auto; padding: 0 16px; }
.panel { background: #fff; border-radius: 8px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.hint { font-size: 12px; color: #666; margin-bottom: 6px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.field { flex: 1; min-width: 120px; }
.field label { display: block; font-size: 11px; color: #666; font-weight: bold; margin-bottom: 2px; }
.field input, .field select { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 10px; }
.presets .plabel { font-size: 13px; color: #1B3A6B; font-weight: bold; }
.presets select { padding: 7px 10px; border: 2px solid #E8A838; background: #FFF8E1; color: #1B3A6B; border-radius: 6px; font-size: 13px; font-weight: bold; min-width: 220px; }
.sec { margin: 0 0 12px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid #E8A838; padding-bottom: 3px; margin-bottom: 6px; }
.sec-title { font-size: 15px; font-weight: bold; color: #1B3A6B; }
/* Fixed two-column layout on wider screens (phones stay single-column) */
.cols { display: flex; gap: 26px; align-items: flex-start; }
.colx { flex: 1; min-width: 0; }
@media (max-width: 759px) { .cols { display: block; } }
.picker select { padding: 6px 8px; border: 1px solid #1B3A6B; border-radius: 5px; font-size: 13px; background: #fff; min-width: 180px; max-width: 320px; }
.cbwrap { display: block; }
.cbwrap.grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 14px; padding: 3px 2px; cursor: pointer; }
.chk input[type=checkbox] { width: 17px; height: 17px; accent-color: #1B3A6B; flex-shrink: 0; }
.chk .cin { width: 95px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; padding: 2px 5px; }
.grid2 .cin { width: 68px; }
.cbwrap .cin[type=date], .grid2 .cin[type=date] { width: 150px; }
.wrow { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font-size: 14px; }
.wrow select { padding: 6px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13.5px; min-width: 130px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.latrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 2px; font-size: 13px; }
.latrow .lname { flex: 1; }
.lat { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; font-weight: bold; color: #1B3A6B; cursor: pointer; font-size: 12px; }
.lat input[type=checkbox] { width: 16px; height: 16px; accent-color: #1B3A6B; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #E8F0FB; border: 1px solid #1B3A6B; color: #1B3A6B; border-radius: 14px; padding: 4px 10px; font-size: 13.5px; }
.chip .cin { width: 74px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; padding: 1px 4px; }
.chip .x { cursor: pointer; font-weight: bold; color: #C62828; font-size: 14px; line-height: 1; }
.chip .sbadge { background: #1B3A6B; color: #fff; border-radius: 9px; padding: 0 6px; font-weight: bold; cursor: pointer; font-size: 11px; }
.moretoggle { margin-top: 12px; padding: 8px 10px; background: #f0f4f8; border: 1px dashed #1B3A6B; border-radius: 6px; color: #1B3A6B; font-weight: bold; font-size: 13px; cursor: pointer; }
.freebox { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; resize: vertical; min-height: 40px; }
.btn-row { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-primary { background: #1B3A6B; color: #fff; }
.btn-secondary { background: #E8A838; color: #1B3A6B; }
.btn-outline { background: #fff; color: #1B3A6B; border: 2px solid #1B3A6B; }
.copied-msg { display: none; color: #2E7D32; font-weight: bold; font-size: 13px; margin-left: 6px; }
.output-panel { display: none; background: #fff; border-radius: 8px; padding: 18px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.output-panel.active { display: block; }
.plan { background: #fff; color: #222; }
[contenteditable]:focus { outline: 2px dashed #E8A838; outline-offset: 4px; }
.plan-header { border-bottom: 3px solid #1B3A6B; padding-bottom: 6px; margin-bottom: 10px; }
.plan-header .t { font-size: 17px; font-weight: bold; color: #1B3A6B; }
.plan-header .s { font-size: 12px; color: #666; }
.plan-line { font-size: 13px; margin-bottom: 4px; line-height: 1.45; }
.plan-line b { color: #1B3A6B; }
.outblock { border: 1px solid #e2e6ee; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.outhead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; font-weight: bold; color: #1B3A6B; font-size: 14px; }
.outhead .btn { padding: 6px 12px; font-size: 12px; }
.handout { background: #fff; color: #222; }
.ph-header { border-bottom: 3px solid #1B3A6B; padding-bottom: 6px; margin-bottom: 10px; }
.ph-header .t { font-size: 17px; font-weight: bold; color: #1B3A6B; }
.ph-header .s { font-size: 12px; color: #666; }
.ph-sec { margin-bottom: 8px; font-size: 13px; line-height: 1.45; }
.ph-sec b { color: #1B3A6B; }
.ph-warn { color: #C62828; font-weight: bold; }
.ph-footer { margin-top: 12px; padding-top: 8px; border-top: 2px solid #1B3A6B; text-align: center; font-size: 12.5px; font-weight: bold; color: #1B3A6B; }
.hp-doc { border-top: 2px dashed #94a3b8; margin-top: 14px; padding-top: 12px; font-size: 12.5px; line-height: 1.55; color: #1e2a3a; }
.hp-doc .hp-head { text-align: center; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 3px solid #1B3A6B; position: relative; }
.hp-doc .hp-head:after { content: ""; position: absolute; left: 35%; right: 35%; bottom: -7px; height: 4px; background: #E8A838; border-radius: 2px; }
.hp-doc .hp-practice { font-size: 19px; font-weight: bold; color: #1B3A6B; letter-spacing: .4px; }
.hp-doc .hp-title { font-size: 15px; font-weight: bold; margin-top: 3px; }
.hp-doc .hp-sub { font-size: 11px; color: #667; margin-top: 2px; }
.hp-doc h3 { color: #1B3A6B; font-size: 13.5px; border-bottom: 2px solid #E8A838; padding-bottom: 2px; margin: 14px 0 6px; }
.hp-doc ul, .hp-doc ol { margin: 4px 0 8px 22px; }
.hp-doc li { margin-bottom: 3px; }
.hp-doc p { margin-bottom: 7px; }
.hp-doc table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; border-radius: 6px; overflow: hidden; }
.hp-doc td { border: 1px solid #dbe3ef; padding: 6px 10px; font-size: 12.5px; vertical-align: top; }
.hp-doc td:first-child { background: #f0f4f8; color: #1B3A6B; font-weight: bold; width: 30%; }
.hp-doc tr:nth-child(even) td:not(:first-child) { background: #fafbfd; }
.hp-doc .hp-foot { margin-top: 12px; padding-top: 6px; border-top: 2px solid #1B3A6B; text-align: center; font-weight: bold; color: #1B3A6B; font-size: 12px; }
@media print {
  body { background: #fff; }
  .hp-doc { border-top: none; page-break-before: always; margin-top: 0; padding-top: 0; }
  .hp-doc table, .hp-doc h3 { page-break-inside: avoid; }
  body.pp-provider * { visibility: hidden; }
  body.pp-provider #plan, body.pp-provider #plan * { visibility: visible; }
  body.pp-provider #plan { position: absolute; left: 0; top: 0; width: 100%; }
  body.pp-patient * { visibility: hidden; }
  body.pp-patient #patient, body.pp-patient #patient * { visibility: visible; }
  body.pp-patient #patient { position: absolute; left: 0; top: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="header"><h1>Plan Sheet</h1><span>Robert H. Rolf, MD | Beacon Orthopaedics</span></div>
<div class="container">
  <div class="panel">
    <div class="row">
      <div class="field"><label>Patient</label><input id="p-name"></div>
      <div class="field" style="max-width:140px"><label>DOB</label><input id="p-mrn" placeholder="mm/dd/yyyy"></div>
      <div class="field" style="max-width:130px"><label>Date</label><input id="p-date" type="date"></div>
      <div class="field" style="max-width:140px"><label>Side (default)</label><select id="global-side"><option value="right">Right</option><option value="left">Left</option><option value="bilateral">Bilateral</option></select></div>
    </div>
    <div class="presets">
      <span class="plabel">Visit type:</span>
      <select id="vtype-sel" onchange="onVisitTypeChange()" style="min-width:210px">
        <option value="">— select visit type —</option>
        <option value="new">New patient</option>
        <option value="estab">Established patient — new problem</option>
        <option value="fu">Follow-up</option>
        <option value="postop">Post-op</option>
      </select>
      <select id="dx-sel" onchange="applyDxPreset()" style="min-width:230px;display:none"></select>
      <select id="ps-proc-sel" onchange="applyPostopNew()" style="min-width:210px;display:none"></select>
      <select id="ps-visit-sel" onchange="applyPostopNew()" style="min-width:150px;display:none"></select>
    </div>
    <div class="hint">Pick <b>Visit type</b> &rarr; <b>diagnosis</b> (post-op: <b>surgery + visit</b>), then adjust. Tag sections: tap the <b>R/L/B</b> badge to change a tag's side.</div>
    <div id="form-root"></div>
    <div class="sec">
      <div class="sec-title">Other / free-text notes</div>
      <textarea class="freebox" id="p-other" placeholder="Anything not captured above..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="generate()">Generate Plan</button>
      <button class="btn btn-outline" onclick="clearAll()">Clear</button>
    </div>
  </div>
  <div class="output-panel" id="output-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <h2 style="color:#1B3A6B;">Output</h2>
      <button class="btn btn-outline" onclick="document.getElementById('output-panel').classList.remove('active')">Close</button>
    </div>
    <div class="outblock">
      <div class="outhead"><span>Plan / Visit summary <small style="font-weight:normal;color:#888">(tap text to edit before copy/print)</small></span>
        <span><button class="btn btn-secondary" onclick="copyPlan()">Copy</button>
        <button class="btn btn-primary" onclick="printPlanAll()">Print + handouts</button>
        <button class="btn btn-outline" onclick="printPlan()">Print</button>
        <span class="copied-msg" id="copy-msg">Copied!</span></span></div>
      <div class="plan" id="plan" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<script>
var SECTIONS = [
  { key:'dx', title:'Diagnosis', drop:true, lat:true,
    groups:[
      {label:'Rotator cuff', tokens:['RCI','RCT','pRCT','IrrRTC','?RCT']},
      {label:'Arthritis', tokens:['GHoa','ACoa','RCA']},
      {label:'Instability / labrum', tokens:['D/L','SLAP','ALT','PLT','?SLAP','GHBL']},
      {label:'Biceps', tokens:['BT','Brupture','DBrupture']},
      {label:'Fracture', tokens:['PHfx','ClavicleFX']}
    ], items:[
    ['Px','pain'],['sprain','sprain'],['strain','strain'],['RCI','rotator cuff impingement'],['RCT','rotator cuff tear'],['pRCT','partial-thickness rotator cuff tear'],
    ['RCA','rotator cuff arthropathy'],['GHoa','glenohumeral osteoarthritis'],['ACoa','AC joint osteoarthritis'],['Adcap','adhesive capsulitis'],['SLAP','SLAP tear'],
    ['ALT','anterior labral tear'],['PLT','posterior labral tear'],['PHfx','proximal humerus fracture'],['BT','biceps tendinitis'],['Brupture','biceps rupture'],
    ['CT','calcific tendinitis'],['D/L','dislocation / instability'],['ClavicleFX','clavicle fracture'],['IrrRTC','irreparable rotator cuff tear'],['GHBL','glenohumeral bone loss'],
    ['?RCT','possible rotator cuff tear'],['?SLAP','possible SLAP tear'],['S/P','status post'],['DBrupture','distal biceps rupture']
  ]},
  { key:'postop', title:'Post-op', grid2:true, items:[
    ['Reviewed images','reviewed operative / arthroscopy images with the patient'],['Wound check','wound checked, healing appropriately'],
    ['Steri-strips','remove steri-strips next week if not already off'],['Strength testing','began strength testing'],['Discharge','discharged from care']
  ]},
  { key:'inj', title:'Injection', drop:true, lat:true, items:[
    ['suba','subacromial'],['AC','AC joint'],['GH','glenohumeral'],['GH2','glenohumeral (2nd) (?)'],['GH2INB','glenohumeral 2nd + block (?)'],['BT','biceps'],['SSN','suprascapular nerve'],['STB','STB (?)'],['ASP','with aspiration'],['visco','viscosupplementation'],['PRP','PRP']
  ]},
  { key:'img', title:'Imaging ordered', grid2:true, items:[
    ['X-ray','X-ray'],['C-spine X-ray','cervical spine X-ray'],['MRI','MRI'],['MRA','MR arthrogram'],['EMG','EMG'],['CT','CT'],['CTA','CT arthrogram'],['US','ultrasound'],['Bone scan','bone scan'],['xray marker','X-ray with marker']
  ]},
  { key:'pt', title:'Physical therapy', grid2:true, items:[
    ['PT 1x4','physical therapy 1×/week for 4 weeks'],['PT 2x6','physical therapy 2×/week for 6 weeks'],['Continue PT','continue physical therapy'],['PT->HEP','transition from physical therapy to a home program'],['HEP','home exercise program'],['Continue HEP','continue home program'],
    ['AAOS','AAOS handout given'],['TSMPA','TSMPA handout given'],['Sleeper stretch','sleeper stretch handout given'],['1st set (RSA)','1st set of exercises handout given (reverse arthroplasty)'],['2nd set (RSA)','2nd set of exercises handout given (reverse arthroplasty)'],['Iontophoresis','iontophoresis']
  ]},
  { key:'meds', title:'Medications / treatment', grid2:true, items:[
    ['Aspirin','aspirin 81 mg PO BID'],['Tylenol','acetaminophen 1000 mg up to 3-4 times daily'],['meloxicam','meloxicam'],['ibuprofen','ibuprofen'],['diclofenac','diclofenac'],['Celebrex','celecoxib'],
    ['Voltaren gel','diclofenac gel'],['Medrol dose pack','Medrol dose pack'],['Journavx','Journavx (suzetrigine)'],['Tramadol','tramadol {}','dose'],['Oxycodone','oxycodone {}','dose'],['Norco','hydrocodone-acetaminophen {}','dose'],['Cyclobenzaprine','cyclobenzaprine {}','dose'],['Gabapentin','gabapentin {}','dose'],['Prednisone','prednisone'],['Ice','ice']
  ]},
  { key:'dme', title:'DME', grid2:true, items:[ ['Posling','post-op sling'],['simple','simple sling'],['cuffcollar','cuff-and-collar'],['Other','{}','specify'] ]},
  { key:'handout', title:'Surgical handouts', grid2:true, items:[
    ['TSA','total shoulder arthroplasty handout'],['RSA','reverse total shoulder arthroplasty handout'],['RCR','rotator cuff repair handout'],['Instability','instability / Bankart handout'],['Impingement','impingement surgery handout'],['Biceps tenodesis','biceps tenodesis handout'],['Clavicle ORIF','clavicle ORIF handout'],['Proximal humerus ORIF','proximal humerus ORIF handout'],['FAQ','frequently asked questions handout']
  ]},
  { key:'condition', title:'Condition handouts (info guides)', grid2:true, items:[
    ['Rotator cuff','rotator cuff information guide'],['Impingement','impingement information guide'],['AC arthritis','AC arthritis information guide'],['Biceps tendinitis','biceps tendinitis information guide'],['SLAP','SLAP tear information guide'],['GH arthritis','glenohumeral arthritis information guide'],['OA','osteoarthritis information guide'],['Adhesive capsulitis','adhesive capsulitis information guide'],['Instability','instability information guide'],['RCA','rotator cuff arthropathy information guide'],['Calcific tendinitis','calcific tendinitis information guide'],['Fracture','fracture information guide']
  ]},
  { key:'restrict', title:'Restrictions', grid2:true, weightDrop:5, items:[
    ['5 lb','no lifting greater than 5 lb'],['10 lb','no lifting greater than 10 lb'],['15 lb','no lifting greater than 15 lb'],['30 lb','no lifting greater than 30 lb'],['no limit','no lifting restrictions'],['No PPL','no pushing, pulling, or lifting'],['No overhead','no overhead reaching'],['No repetitive','no repetitive motion'],['No driving','no driving'],['Work note','work note provided'],['School note','school note provided'],['ATC note','note for athletic trainer'],['RTW','return to work {}','date']
  ]},
  { key:'surg', title:'Surgery', drop:true, lat:true, nSided:9, items:[
    ['TSA','total shoulder arthroplasty'],['RSA','reverse total shoulder arthroplasty'],['RCR','rotator cuff repair'],['Scope','shoulder arthroscopy'],['BT','biceps tenodesis'],['Labrum','labral repair / instability'],['SCR','superior capsular reconstruction'],['ORIF','ORIF'],['Distal biceps','distal biceps repair'],
    ['ready','ready for surgery'],['thinking','considering surgery']
  ]},
  { key:'fu', title:'Follow-up', grid2:true, items:[
    ['in ___','return in {}','interval'],['INB','INB (?)'],['PRN','as needed'],['afterimaging','after imaging'],['afterPSI','after PSI planning'],['Call>MRI','call after MRI'],['spine','spine referral'],['hand','hand referral'],['PNS','PNS (?)'],['email','email patient']
  ]},
];
var SEC_BY_KEY={}; SECTIONS.forEach(function(s){ SEC_BY_KEY[s.key]=s; });
// Every section gets an "Other ___" free-text item (skips sections that already have one)
SECTIONS.forEach(function(sec){
  if(!sec.items.some(function(it){ return it[0]==='Other'; })) sec.items.push(['Other','{}','specify']);
});

/* Presets by token so adding items never breaks them. pick = [sectionKey, token, optionalValue] */
var PRESETS = [
  // ---- New-visit standards ----
  { label:'Impingement / bursitis', group:'New visit', picks:[['dx','RCI'],['inj','suba'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Impingement'],['fu','in ___','6 weeks']] },
  { label:'Rotator cuff tear', group:'New visit', picks:[['dx','RCT'],['inj','suba'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Rotator cuff'],['fu','in ___','6 weeks']] },
  { label:'Acute rotator cuff tear', group:'New visit', picks:[['dx','RCT'],['img','MRI'],['surg','thinking'],['condition','Rotator cuff'],['fu','in ___','2 weeks']], note:'Acute tear with dysfunction — expedite MRI and surgical discussion.' },
  { label:'AC joint arthritis', group:'New visit', picks:[['dx','ACoa'],['inj','AC'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','AC arthritis'],['fu','in ___','6 weeks']] },
  { label:'Biceps tendinitis', group:'New visit', picks:[['dx','BT'],['inj','BT'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Biceps tendinitis'],['fu','in ___','6 weeks']] },
  { label:'SLAP tear', group:'New visit', picks:[['dx','SLAP'],['inj','suba'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','SLAP'],['fu','in ___','6 weeks']] },
  { label:'Glenohumeral arthritis', group:'New visit', picks:[['dx','GHoa'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','GH arthritis'],['fu','in ___','6 weeks']], note:'GH injection optional if symptomatic.' },
  { label:'Adhesive capsulitis', group:'New visit', picks:[['dx','Adcap'],['inj','suba'],['pt','PT 2x6'],['pt','Sleeper stretch'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Adhesive capsulitis'],['fu','in ___','10-12 weeks']], note:'If no better, glenohumeral injection under ultrasound in 2 weeks.' },
  { label:'Calcific tendinitis', group:'New visit', picks:[['dx','CT'],['inj','suba'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Calcific tendinitis'],['fu','in ___','6 weeks']], note:'Consider US-guided barbotage if persists.' },
  { label:'Instability / dislocation', group:'New visit', picks:[['dx','D/L'],['img','MRA'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','Instability'],['fu','in ___','6 weeks']], note:'Activity modification; no injection.' },
  { label:'Rotator cuff arthropathy', group:'New visit', picks:[['dx','RCA'],['pt','PT 1x4'],['meds','meloxicam'],['meds','Tylenol'],['meds','Ice'],['condition','RCA'],['fu','in ___','6 weeks']], note:'GH injection optional; reverse arthroplasty pathway.' },
  { label:'Distal biceps rupture', group:'New visit', picks:[['dx','DBrupture'],['img','MRI'],['dme','Posling'],['meds','Tylenol']], note:'Urgent surgical discussion — repair within ~2–3 weeks.' },
  { label:'Fracture, clavicle — non-op', group:'New visit', picks:[['dx','ClavicleFX'],['dme','Posling'],['meds','Tylenol'],['img','X-ray'],['condition','Fracture'],['fu','in ___','1 week']], note:'Non-operative: weekly X-rays x2 weeks to confirm alignment; start PT after 2 weeks.' },
  { label:'Fracture, prox humerus — non-op', group:'New visit', picks:[['dx','PHfx'],['dme','Posling'],['meds','Tylenol'],['img','X-ray'],['condition','Fracture'],['fu','in ___','1 week']], note:'Non-operative: weekly X-rays x2 weeks to confirm alignment; start PT after 2 weeks.' },
  { label:'Fracture, clavicle — surgical', group:'New visit', picks:[['dx','ClavicleFX'],['dme','Posling'],['meds','Tylenol'],['surg','thinking'],['condition','Fracture']], note:'Set up for surgery (ORIF clavicle).' },
  { label:'Fracture, prox humerus — surgical', group:'New visit', picks:[['dx','PHfx'],['img','CT'],['dme','Posling'],['meds','Tylenol'],['surg','thinking'],['condition','Fracture']], note:'CT to evaluate fracture alignment; set up for surgery.' },
  { label:'Pre-op discussion', group:'New visit', picks:[['handout','FAQ']] },

function renderSection(sec){

function renderForm(){

function addChip(key, sel){
  var i=sel.value; sel.value=''; if(i==='') return; i=parseInt(i,10);
  if(!chips[key]) chips[key]=[];
  var sec=SEC_BY_KEY[key];
  var existing=null;
  chips[key].forEach(function(e){ if(e.i===i) existing=e; });
  if(existing){
    // Re-selecting a sided item: combine sides (e.g. right + second pick = bilateral)
    if(existing.side!==null && existing.side!==undefined && existing.side!=='bilateral'){
      existing.side='bilateral';
      renderChips(key);
    }
    return;
  }
  chips[key].push({i:i, v:'', side: isSided(sec,i)?(val('global-side')||'right'):null});
  renderChips(key);
}
function removeChip(key,pos){ chips[key].splice(pos,1); renderChips(key); }
// B is exclusive: checking B clears R/L, and checking R or L clears B
function latSide(key,i,w){
  var r=document.getElementById('lr_'+key+'_'+i+'_R'), l=document.getElementById('lr_'+key+'_'+i+'_L'), bi=document.getElementById('lr_'+key+'_'+i+'_B');
  if(w==='B' && bi.checked){ r.checked=false; l.checked=false; }
  else if((w==='R'&&r.checked)||(w==='L'&&l.checked)){ bi.checked=false; }
}
function setChipVal(key,pos,v){ if(chips[key]&&chips[key][pos]) chips[key][pos].v=v; }
function cycleSide(key,pos){ var e=chips[key][pos]; if(e.side===null) return; e.side=SIDE_ORDER[(SIDE_ORDER.indexOf(e.side)+1)%3]; renderChips(key); }
function renderChips(key){
  var sec=SEC_BY_KEY[key]; var box=document.getElementById('chips_'+key); if(!box) return; var h='';
  (chips[key]||[]).forEach(function(e,pos){
    var item=sec.items[e.i]; h+='<span class="chip">';
    if(e.side!==null && e.side!==undefined){ h+='<span class="sbadge" title="tap to change side" onclick="cycleSide(\''+key+'\','+pos+')">'+(SABBR[e.side]||'?')+'</span> '; }
    h+=esc(item[0]);
    if(item[2]){ h+=' <input class="cin" placeholder="'+esc(item[2])+'" value="'+esc(e.v)+'" oninput="setChipVal(\''+key+'\','+pos+',this.value)">'; }
    h+=' <span class="x" onclick="removeChip(\''+key+'\','+pos+')">×</span></span>';
  });
  box.innerHTML=h;
}
function renderAllChips(){ SECTIONS.forEach(function(s){ if(s.drop) renderChips(s.key); }); }

function applyPicks(picks, note){
  chips={}; renderForm();
  document.getElementById('p-other').value = '';
  var gs=val('global-side')||'right';
  picks.forEach(function(pk){
    var key=pk[0], token=pk[1], value=pk[2]||'', sec=SEC_BY_KEY[key]; if(!sec) return;
    var i=tokenIndex(sec,token); if(i<0) return;
    if(sec.drop){
      if(!chips[key]) chips[key]=[];
      if(chips[key].some(function(e){return e.i===i;})) return;
      chips[key].push({i:i, v:value, side: isSided(sec,i)?gs:null});
    } else if(sec.latRows){
      var w = gs==='bilateral' ? 'B' : (gs==='left' ? 'L' : 'R');
      var lcb=document.getElementById('lr_'+key+'_'+i+'_'+w); if(lcb) lcb.checked=true;
      if(value){ var lci=document.getElementById('ci_'+key+'_'+i); if(lci) lci.value=value; }
    } else if(sec.weightDrop && i<sec.weightDrop){
      // weight limits live in the dropdown, not checkboxes
      var ws=document.getElementById('weight-limit'); if(ws) ws.value=String(i);
    } else {
      var cb=document.getElementById('c_'+key+'_'+i); if(cb) cb.checked=true;
      if(value){ var ci=document.getElementById('ci_'+key+'_'+i); if(ci) ci.value=value; }
    }
  });
  if(note){ var ob=document.getElementById('p-other'); if(ob) ob.value = note; }
  renderAllChips();
}

function fmtDate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? (+m[2])+'/'+(+m[3])+'/'+m[1] : s; } // yyyy-mm-dd -> m/d/yyyy
function expandItem(sec,e){ var item=sec.items[e.i]; var x=cleanX(item[1]); if(item[2]){ var vv=(item[2]==='date')?fmtDate(e.v):e.v; x = x.indexOf('{}')>=0 ? x.replace('{}', vv||'___') : (x+(vv?' '+vv:'')); } return x; }
function collect(sec){
  if(sec.drop) return chips[sec.key]||[];
  if(sec.latRows){
    var la=[];
    sec.items.forEach(function(item,i){
      var r=document.getElementById('lr_'+sec.key+'_'+i+'_R'), l=document.getElementById('lr_'+sec.key+'_'+i+'_L'), bi=document.getElementById('lr_'+sec.key+'_'+i+'_B');
      var rc=r&&r.checked, lc=l&&l.checked, bc=bi&&bi.checked;
      if(!(rc||lc||bc)) return;
      la.push({i:i, v:val('ci_'+sec.key+'_'+i), side:(bc||(rc&&lc))?'bilateral':(rc?'right':'left')});
    });
    return la;
  }
  var arr=[];
  if(sec.weightDrop){ var wv=val('weight-limit'); if(wv!==''){ arr.push({i:parseInt(wv,10), v:'', side:null}); } }
  sec.items.forEach(function(item,i){ var cb=document.getElementById('c_'+sec.key+'_'+i); if(cb&&cb.checked){ arr.push({i:i, v:val('ci_'+sec.key+'_'+i), side:null}); } }); return arr;
}
function sectionText(sec){
  var arr=collect(sec); if(!arr.length) return '';
  if(sec.lat || sec.latRows){ var groups={}, order=[]; arr.forEach(function(e){ var s=e.side||''; if(!groups[s]){groups[s]=[];order.push(s);} groups[s].push(expandItem(sec,e)); }); return order.map(function(s){ return (s?cap(s)+' — ':'')+groups[s].join(', '); }).join('; '); }
  var picked=arr.map(function(e){ return expandItem(sec,e); });
  return (sec.prefix?picked.map(function(p){return sec.prefix+p;}):picked).join(', ');
}

<script id="handout-data">var HANDOUT_HTML = {"c_gh": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Glenohumeral Osteoarthritis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Wear-and-tear arthritis of the ball-and-socket shoulder joint</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Most common in adults over 50; may follow injury or overuse</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Shoulder stiffness and pain that worsens with activity over time</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays showing joint space narrowing and bone spurs</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Total Shoulder Replacement when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The cartilage that cushions the ball-and-socket joint of the shoulder wears down over time. As the protective surface thins, bones begin to rub against each other, causing pain, stiffness, and loss of motion. Prior injuries, rotator cuff disease, and inflammatory conditions can accelerate this process.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Stiffness and difficulty moving the joint</p>\n<p>\u2022 Pain that worsens with activity</p>\n<p>\u2022 Aching at rest or at night</p>\n<p>\u2022 Grinding, clicking, or popping</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Limited range of motion</p>\n<p>\u2022 Difficulty reaching overhead or behind the back</p>\n<p>\u2022 Pain putting on a seatbelt or coat</p>\n<p>\u2022 Progressive worsening over months to years</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>\u2022 Activity modification to reduce painful motions</p>\n<p>\u2022 Physical therapy for motion and strength</p>\n<p>\u2022 OTC medications (Tylenol, NSAIDs)</p>\n<p>\u2022 Corticosteroid injections</p>\n<p>\u2022 Heat or ice for symptom management</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>\u2022 Arthroscopic debridement (cleaning the joint)</p>\n<p>\u2022 Total Shoulder Replacement (TSA)</p>\n<p>\u2022 Replaces ball and socket with implants</p>\n<p>\u2022 See separate TSA handout for details</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will shoulder arthritis get worse over time?</h3>\n<blockquote>\n<p>Yes, osteoarthritis is progressive. The rate varies, but cartilage loss continues gradually. Treatment focuses on slowing progression and managing pain.</p>\n</blockquote>\n<h3>Q: Can exercise help or does it make it worse?</h3>\n<blockquote>\n<p>The right exercises help. Physical therapy strengthens supporting muscles and preserves motion. Avoid high-impact activities that increase joint stress.</p>\n</blockquote>\n<h3>Q: How do I know when it's time for surgery?</h3>\n<blockquote>\n<p>When pain limits your daily activities, sleep, or quality of life despite consistent conservative treatment, it may be time to discuss surgical options.</p>\n</blockquote>\n<h3>Q: Is shoulder replacement a major surgery?</h3>\n<blockquote>\n<p>It is a significant procedure, but most patients go home the same day and experience substantial pain relief. See the separate TSA handout for full recovery details.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_rca": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Arthropathy</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Shoulder arthritis caused by a large, irreparable rotator cuff tear</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Older adults and those with long-standing untreated cuff tears</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain and weakness with overhead use; grinding in the joint</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays (MRI if needed)</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Reverse Shoulder Replacement when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The rotator cuff is a group of muscles and tendons that stabilize the shoulder and allow you to lift and rotate your arm. When a rotator cuff tear is large and left untreated, the humeral head (ball) migrates upward and grinds against the acromion. Over time this causes cartilage loss and arthritis in the joint.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Deep ache in the shoulder</p>\n<p>\u2022 Worse with overhead activity</p>\n<p>\u2022 Night pain disrupting sleep</p>\n<p>\u2022 Pain at rest in advanced cases</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness lifting the arm</p>\n<p>\u2022 Cannot actively raise arm (passive motion may remain)</p>\n<p>\u2022 Grinding, popping, or catching</p>\n<p>\u2022 Difficulty with daily tasks (combing hair, dressing)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Early Stage)</h3>\n<p>\u2022 Physical therapy for strength and mobility</p>\n<p>\u2022 Activity modification</p>\n<p>\u2022 Anti-inflammatory medications (NSAIDs)</p>\n<p>\u2022 Corticosteroid injections for temporary relief</p></td>\n<td><h3>Surgical (Advanced)</h3>\n<p>\u2022 Reverse Shoulder Replacement: most common surgical treatment</p>\n<p>\u2022 Deltoid muscle compensates for missing cuff</p>\n<p>\u2022 Restores function and reduces pain</p>\n<p>\u2022 See separate RSA handout for details</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Large tears generally do not heal without surgery. However, many patients manage symptoms successfully with therapy and injections.</p>\n</blockquote>\n<h3>Q: Is this different from a regular rotator cuff tear?</h3>\n<blockquote>\n<p>Yes. Rotator cuff arthropathy means the tear has been present long enough to cause arthritis in the joint, not just tendon damage.</p>\n</blockquote>\n<h3>Q: What happens if I don't have surgery?</h3>\n<blockquote>\n<p>The condition typically progresses slowly. Conservative treatment can manage pain, but function may continue to decline over time.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes, regardless of surgical or non-surgical treatment. Physical therapy is essential to maintain strength, mobility, and function in the shoulder.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_rc": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A partial or complete tear of one or more rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Rotator Cuff Tears</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>\u2022 Degenerative: gradual wear over time (most common)</p>\n<p>\u2022 Traumatic: from a fall, lifting, or sudden injury</p>\n<p>\u2022 Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>\u2022 Partial-thickness: tendon is damaged but not torn through</p>\n<p>\u2022 Full-thickness (small): &lt;1 cm tear</p>\n<p>\u2022 Full-thickness (large): 1-3 cm tear</p>\n<p>\u2022 Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Aching at the top or side of the shoulder</p>\n<p>\u2022 Pain worse at night, especially lying on that side</p>\n<p>\u2022 Sharp pain with overhead motions</p>\n<p>\u2022 Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness lifting or rotating the arm</p>\n<p>\u2022 Difficulty reaching behind back (bra strap, belt)</p>\n<p>\u2022 Arm feels heavy or fatigued</p>\n<p>\u2022 Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all rotator cuff tears require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>\u2022 Physical therapy to strengthen surrounding muscles</p>\n<p>\u2022 Anti-inflammatory medications (oral or topical)</p>\n<p>\u2022 Cortisone injection for pain relief</p>\n<p>\u2022 Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>\u2022 Arthroscopic rotator cuff repair (most common)</p>\n<p>\u2022 Mini-open repair for larger tears</p>\n<p>\u2022 Tendon transfer or superior capsular reconstruction</p>\n<p>\u2022 Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_imp": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Impingement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Pinching of the tendons and bursa in the shoulder joint space</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Shoulder Impingements</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>\u2022 Degenerative: gradual wear over time (most common)</p>\n<p>\u2022 Traumatic: from a fall, lifting, or sudden injury</p>\n<p>\u2022 Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>\u2022 Partial-thickness: tendon is damaged but not torn through</p>\n<p>\u2022 Full-thickness (small): &lt;1 cm tear</p>\n<p>\u2022 Full-thickness (large): 1-3 cm tear</p>\n<p>\u2022 Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Aching at the top or side of the shoulder</p>\n<p>\u2022 Pain worse at night, especially lying on that side</p>\n<p>\u2022 Sharp pain with overhead motions</p>\n<p>\u2022 Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness lifting or rotating the arm</p>\n<p>\u2022 Difficulty reaching behind back (bra strap, belt)</p>\n<p>\u2022 Arm feels heavy or fatigued</p>\n<p>\u2022 Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all shoulder impingement require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>\u2022 Physical therapy to strengthen surrounding muscles</p>\n<p>\u2022 Anti-inflammatory medications (oral or topical)</p>\n<p>\u2022 Cortisone injection for pain relief</p>\n<p>\u2022 Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>\u2022 Arthroscopic rotator cuff repair (most common)</p>\n<p>\u2022 Mini-open repair for larger tears</p>\n<p>\u2022 Tendon transfer or superior capsular reconstruction</p>\n<p>\u2022 Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_ac": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">AC Joint Arthritis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Arthritis of the small joint at the top of the shoulder (acromioclavicular)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead workers, weightlifters, athletes, and adults with prior AC injuries</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain at the top of the shoulder, especially reaching across the body</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays (tenderness directly over the AC joint)</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Distal Clavicle Excision (DCR) if conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The AC joint is where the collarbone meets the top of the shoulder blade (acromion). The cartilage in this small joint wears down from repetitive overhead use, prior separations, or normal aging. As cartilage thins, bone-on-bone contact causes pain and sometimes a visible bump at the joint.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Pain at the top of the shoulder</p>\n<p>\u2022 Worse with lifting, reaching across body</p>\n<p>\u2022 Tenderness directly over the AC joint</p>\n<p>\u2022 Pain with cross-body movements (seatbelt)</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Clicking, popping, or grinding</p>\n<p>\u2022 Visible bump over the joint (advanced cases)</p>\n<p>\u2022 Difficulty with bench press or push-ups</p>\n<p>\u2022 Pain sleeping on the affected side</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>\u2022 Activity modification (avoid aggravating motions)</p>\n<p>\u2022 NSAIDs (ibuprofen, naproxen)</p>\n<p>\u2022 Ice or heat for comfort</p>\n<p>\u2022 Physical therapy for mechanics</p>\n<p>\u2022 Corticosteroid injection into the AC joint</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>\u2022 Distal Clavicle Excision (DCR)</p>\n<p>\u2022 Removes a small portion of collarbone end</p>\n<p>\u2022 Eliminates bone-on-bone contact</p>\n<p>\u2022 Typically done arthroscopically</p>\n<p>\u2022 Short recovery compared to other shoulder surgeries</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Can I still lift weights with AC joint arthritis?</h3>\n<blockquote>\n<p>You may need to modify your routine. Avoid exercises that compress the AC joint (bench press, overhead press, dips) and focus on movements that don't aggravate pain.</p>\n</blockquote>\n<h3>Q: How long does recovery take after DCR surgery?</h3>\n<blockquote>\n<p>Most patients use a sling for 1-2 weeks and return to desk work within days. Full return to lifting typically takes 6-12 weeks.</p>\n</blockquote>\n<h3>Q: Will a cortisone injection cure it?</h3>\n<blockquote>\n<p>Injections provide temporary relief (weeks to months) but do not reverse the arthritis. They are useful for confirming the diagnosis and managing flare-ups.</p>\n</blockquote>\n<h3>Q: Is AC joint arthritis the same as shoulder arthritis?</h3>\n<blockquote>\n<p>No. The AC joint is a separate, small joint at the top of the shoulder. Glenohumeral (shoulder) arthritis affects the main ball-and-socket joint and is a different condition with different treatment.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_bt": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Biceps Tendinitis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Inflammation or irritation of the long head of the biceps tendon in the shoulder</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead athletes, workers with repetitive arm use, adults over 40</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain at the front of the shoulder, worse with lifting or overhead reaching</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam (Speed's test, Yergason's test) + MRI if needed</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Biceps tenodesis or tenotomy when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The long head of the biceps tendon runs through a groove at the front of the shoulder and attaches inside the joint. Repetitive overhead motion, heavy lifting, or age-related degeneration causes the tendon to become inflamed, frayed, or partially torn. Biceps tendinitis often occurs alongside other shoulder problems such as rotator cuff disease, impingement, or labral tears.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Aching at the front of the shoulder</p>\n<p>\u2022 Worse with overhead reaching or lifting</p>\n<p>\u2022 Pain carrying objects with the arm extended</p>\n<p>\u2022 Tenderness in the bicipital groove</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness with elbow flexion or supination</p>\n<p>\u2022 Snapping or popping at the front of the shoulder</p>\n<p>\u2022 Pain with pull-ups, curls, or reaching behind</p>\n<p>\u2022 May interrupt sleep if lying on the shoulder</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>\u2022 Rest and activity modification</p>\n<p>\u2022 Anti-inflammatory medications (NSAIDs)</p>\n<p>\u2022 Physical therapy for shoulder mechanics</p>\n<p>\u2022 Corticosteroid injection around the tendon</p>\n<p>\u2022 Ice after activity</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>\u2022 Biceps tenodesis (relocate and anchor the tendon)</p>\n<p>\u2022 Biceps tenotomy (release the tendon)</p>\n<p>\u2022 Often done alongside rotator cuff repair</p>\n<p>\u2022 Tenodesis preferred in active/younger patients</p>\n<p>\u2022 Recovery: 3-4 months</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: What is the difference between tenodesis and tenotomy?</h3>\n<blockquote>\n<p>Tenodesis detaches the biceps from inside the joint and re-anchors it to the upper arm bone, preserving cosmetic appearance and strength. Tenotomy simply releases the tendon. Tenodesis is preferred for active patients.</p>\n</blockquote>\n<h3>Q: Will the pain go away without surgery?</h3>\n<blockquote>\n<p>Many patients improve significantly with therapy and injections. Surgery is reserved for cases that do not respond after several months of conservative treatment.</p>\n</blockquote>\n<h3>Q: Is biceps tendinitis related to my rotator cuff?</h3>\n<blockquote>\n<p>Often, yes. The biceps tendon shares space with the rotator cuff, and inflammation in one frequently affects the other. Your surgeon will evaluate both during treatment.</p>\n</blockquote>\n<h3>Q: Can I still exercise?</h3>\n<blockquote>\n<p>Yes, but you may need to modify overhead and heavy curling movements temporarily. Your therapist will guide appropriate activity levels.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_slap": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">SLAP Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the labrum at the top of the shoulder socket (where biceps attaches)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead athletes, heavy lifters, and adults from falls or repetitive use</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Deep shoulder pain with catching, popping, or instability</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI arthrogram to view labrum and biceps anchor</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Arthroscopic repair or biceps tenodesis depending on tear and age</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>SLAP stands for Superior Labrum Anterior to Posterior. The labrum is a ring of cartilage that deepens the shoulder socket and anchors the biceps tendon. Tears occur from repetitive overhead motion (throwing, swimming, weightlifting), acute trauma (falling on an outstretched arm), or natural aging. The labrum weakens with age, making tears over 40 increasingly common.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Deep pain with overhead movement</p>\n<p>\u2022 Pain with lifting or throwing</p>\n<p>\u2022 Aching after activity</p>\n<p>\u2022 Night pain in some cases</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Catching, popping, or grinding</p>\n<p>\u2022 Shoulder feeling unstable or \"slipping\"</p>\n<p>\u2022 Decreased strength</p>\n<p>\u2022 Loss of throwing velocity (athletes)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>\u2022 Rest and activity modification</p>\n<p>\u2022 Anti-inflammatory medications</p>\n<p>\u2022 Physical therapy for stability</p>\n<p>\u2022 Corticosteroid injection for pain relief</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>\u2022 Arthroscopic labral repair (reattach labrum)</p>\n<p>\u2022 Biceps tenodesis (relocate biceps anchor)</p>\n<p>\u2022 Tenodesis often preferred for patients &gt;35-40</p>\n<p>\u2022 Recovery: 4-6 months depending on procedure</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: What is the difference between a repair and a tenodesis?</h3>\n<blockquote>\n<p>A repair reattaches the torn labrum to the bone. A tenodesis detaches the biceps from the labrum and re-anchors it lower on the arm. Tenodesis is often preferred in patients over 35-40 because the labrum becomes less reliable with age.</p>\n</blockquote>\n<h3>Q: Can I return to overhead sports after surgery?</h3>\n<blockquote>\n<p>Many patients return to sports. Recovery takes 4-6 months with dedicated physical therapy. Throwing athletes may take longer to regain full velocity.</p>\n</blockquote>\n<h3>Q: Do all SLAP tears need surgery?</h3>\n<blockquote>\n<p>No. Many SLAP tears, especially in older patients, respond well to therapy and activity modification. Surgery is reserved for cases that don't improve with conservative care.</p>\n</blockquote>\n<h3>Q: What is the difference between a SLAP tear and a rotator cuff tear?</h3>\n<blockquote>\n<p>They are different structures. The labrum is the cartilage ring around the socket; the rotator cuff is a group of tendons on the ball. Both can cause shoulder pain but require different treatments.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_adcap": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Frozen Shoulder (Adhesive Capsulitis)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Inflammation and tightening of the shoulder capsule causing stiffness and pain</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Ages 40-60, more common in women, diabetics, thyroid patients</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Progressive loss of shoulder motion in all directions</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam showing restricted active and passive motion</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or manipulation/arthroscopic release</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Frozen Shoulder</h3>\n<p>The shoulder joint is surrounded by a flexible capsule that allows a wide range of motion. In frozen shoulder, this capsule becomes inflamed, thickened, and tight, severely limiting movement. The condition typically progresses through three distinct stages over 12-18 months and often resolves on its own, though recovery can take up to 2-3 years without treatment.</p>\n<h3>The Three Stages</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Freezing Stage (2-9 months)</h3>\n<p>\u2022 Gradual onset of shoulder pain</p>\n<p>\u2022 Pain often worse at night</p>\n<p>\u2022 Slow, progressive loss of motion</p>\n<p>\u2022 Pain precedes stiffness</p></td>\n<td><h3>Frozen Stage (4-12 months)</h3>\n<p>\u2022 Stiffness is the dominant problem</p>\n<p>\u2022 Pain may actually decrease</p>\n<p>\u2022 Significant loss of external rotation, flexion, IR</p>\n<p>\u2022 Daily activities become very difficult</p></td>\n</tr>\n</tbody>\n</table>\n<p>Thawing Stage (5-24 months): Motion gradually returns. The shoulder slowly loosens, and most patients recover a functional range of motion. Full recovery can take 1-3 years from onset.</p>\n<h3>Risk Factors</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Medical Conditions</h3>\n<p>\u2022 Diabetes (2-4x higher risk)</p>\n<p>\u2022 Thyroid disorders (hypo- or hyperthyroidism)</p>\n<p>\u2022 Cardiac disease or recent cardiac surgery</p>\n<p>\u2022 Autoimmune conditions</p></td>\n<td><h3>Other Factors</h3>\n<p>\u2022 Age 40-60 years</p>\n<p>\u2022 Female sex</p>\n<p>\u2022 Prolonged immobilization (sling, cast, post-surgery)</p>\n<p>\u2022 Previous frozen shoulder (risk of other side)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>The goal of treatment is to reduce pain and restore motion as quickly as possible. Most patients improve with non-surgical treatment, though the timeline can be long. More aggressive interventions are considered when progress stalls or symptoms are severely limiting daily function.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>\u2022 Physical therapy (gentle stretching within pain tolerance)</p>\n<p>\u2022 Oral anti-inflammatory medications</p>\n<p>\u2022 Corticosteroid injection into the joint</p>\n<p>\u2022 Hydrodilatation (saline expansion of the capsule)</p>\n<p>\u2022 Home stretching program (most important factor)</p></td>\n<td><h3>Surgical</h3>\n<p>\u2022 Manipulation under anesthesia (MUA)</p>\n<p>\u2022 Arthroscopic capsular release</p>\n<p>\u2022 Often combined: MUA followed by arthroscopic release</p>\n<p>\u2022 Aggressive PT begins immediately after procedure</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will frozen shoulder go away on its own?</h3>\n<blockquote>\n<p>In most cases, yes, but it can take 1-3 years. Treatment aims to speed up recovery and reduce the severity of symptoms during that time. Some patients retain mild stiffness permanently.</p>\n</blockquote>\n<h3>Q: Can I make it worse by stretching?</h3>\n<blockquote>\n<p>Gentle, consistent stretching is the cornerstone of treatment. However, aggressive or painful stretching can increase inflammation. Work within a tolerable discomfort level. Your therapist will guide appropriate intensity.</p>\n</blockquote>\n<h3>Q: I have diabetes. Does that affect my recovery?</h3>\n<blockquote>\n<p>Diabetic patients tend to have more severe and longer-lasting frozen shoulder. Blood sugar control is important for recovery. Your treatment may need to be more aggressive, and the timeline for improvement may be longer.</p>\n</blockquote>\n<h3>Q: Will it happen in my other shoulder?</h3>\n<blockquote>\n<p>About 20-30% of patients develop frozen shoulder in the opposite shoulder, typically within 5 years. Staying active and maintaining shoulder mobility can help reduce this risk.</p>\n</blockquote>\n<h3>Q: When should I consider surgery?</h3>\n<blockquote>\n<p>If 3-6 months of consistent physical therapy and injections have not improved your motion significantly, manipulation under anesthesia or arthroscopic capsular release may be recommended.</p>\n</blockquote>\n<h3>Q: What is manipulation under anesthesia?</h3>\n<blockquote>\n<p>While you are under general anesthesia, your surgeon gently moves your shoulder through its full range of motion, breaking up the scar tissue and adhesions in the capsule. This is often combined with an arthroscopic capsular release for the best results. Aggressive physical therapy starts immediately after the procedure to maintain the motion gained.</p>\n</blockquote>\n<h3>Q: Can I prevent frozen shoulder?</h3>\n<blockquote>\n<p>There is no guaranteed way to prevent it, but maintaining shoulder mobility is key. If you have a shoulder injury or surgery, begin gentle range-of-motion exercises as soon as your surgeon allows. If you have diabetes or thyroid disease, managing these conditions may reduce your risk.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_instab": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Instability / Labral Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the labrum at the front of the shoulder socket</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Young athletes, contact sports players, and those with shoulder dislocations</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Recurrent instability, feeling the shoulder will \"slip out\"</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI arthrogram to view labral damage</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Arthroscopic Bankart repair to reattach the labrum</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The labrum is a ring of cartilage that deepens the shoulder socket and helps keep the ball (humeral head) centered. When the shoulder dislocates or subluxates (partially slips out), the labrum tears away from the front of the socket. This is called a Bankart lesion. Once torn, the labrum often cannot heal on its own, leaving the shoulder prone to repeated episodes of instability.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain &amp; Instability</h3>\n<p>\u2022 Shoulder feels loose or \"dead arm\"</p>\n<p>\u2022 Fear or apprehension with overhead motions</p>\n<p>\u2022 Pain with reaching behind or to the side</p>\n<p>\u2022 Recurrent dislocations or subluxations</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness with throwing or overhead activity</p>\n<p>\u2022 Catching or locking in certain positions</p>\n<p>\u2022 Difficulty sleeping on the affected side</p>\n<p>\u2022 Loss of confidence in the shoulder</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (First-Time or Mild)</h3>\n<p>\u2022 Physical therapy to strengthen stabilizers</p>\n<p>\u2022 Activity modification</p>\n<p>\u2022 Bracing during sports (temporary)</p>\n<p>\u2022 Appropriate for some first-time dislocations</p></td>\n<td><h3>Surgical (Recurrent Instability)</h3>\n<p>\u2022 Arthroscopic Bankart repair</p>\n<p>\u2022 Labrum reattached with suture anchors</p>\n<p>\u2022 High success rate for preventing re-dislocation</p>\n<p>\u2022 Recovery: 4-6 months for full return to sports</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder keep dislocating without surgery?</h3>\n<blockquote>\n<p>If you have had multiple dislocations, the risk of recurrence is high without surgical repair, especially in younger patients.</p>\n</blockquote>\n<h3>Q: Can I return to contact sports after repair?</h3>\n<blockquote>\n<p>Yes. Most athletes return to full contact sports at 4-6 months. The repaired labrum is typically stronger than the torn state.</p>\n</blockquote>\n<h3>Q: What if I only dislocated once?</h3>\n<blockquote>\n<p>First-time dislocations in patients over 30 may respond to therapy alone. Younger patients and athletes have higher recurrence rates and may benefit from earlier repair.</p>\n</blockquote>\n<h3>Q: How long will I be in a sling?</h3>\n<blockquote>\n<p>Typically 4-6 weeks, followed by gradual range of motion exercises guided by your physical therapist.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_db": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Distal Biceps Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the biceps tendon where it attaches to the forearm (radius bone)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Men 30-60, often from heavy lifting or sudden eccentric load</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Sudden pop at the elbow, pain, bruising, and visible biceps retraction</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam (hook test) + MRI to confirm tear extent</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Surgical reattachment recommended within 2-3 weeks of injury</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Happens</h3>\n<p>The distal biceps tendon connects your biceps muscle to the radius bone near the elbow. A tear typically occurs when a heavy load is applied to the arm while the elbow is bent (such as catching a heavy object or lifting with an unexpected jerk). Most tears are complete, meaning the tendon pulls entirely off the bone. You may hear or feel a \"pop\" and notice the biceps muscle bunch up toward the shoulder.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Immediate (After Injury)</h3>\n<p>\u2022 Sudden sharp pain at the front of the elbow</p>\n<p>\u2022 Audible or palpable pop</p>\n<p>\u2022 Swelling and bruising in the forearm</p>\n<p>\u2022 Visible deformity (\"Popeye\" sign in the upper arm)</p></td>\n<td><h3>Ongoing (If Untreated)</h3>\n<p>\u2022 Weakness turning the forearm (supination)</p>\n<p>\u2022 30-40% loss of supination strength</p>\n<p>\u2022 Cramping with repetitive arm use</p>\n<p>\u2022 Persistent biceps deformity</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Select Cases)</h3>\n<p>\u2022 May be appropriate for low-demand, older patients</p>\n<p>\u2022 Accepts permanent loss of supination strength</p>\n<p>\u2022 Physical therapy to maximize remaining function</p>\n<p>\u2022 Does not restore full anatomy</p></td>\n<td><h3>Surgical (Recommended for Most)</h3>\n<p>\u2022 Reattachment of tendon to the radius bone</p>\n<p>\u2022 Best results within 2-3 weeks of injury</p>\n<p>\u2022 Restores supination and flexion strength</p>\n<p>\u2022 Return to full activity at 4-6 months</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Is surgery urgent?</h3>\n<blockquote>\n<p>Ideally within 2-3 weeks. After that, the tendon retracts and scarring makes repair more difficult. If you suspect a tear, see your surgeon promptly.</p>\n</blockquote>\n<h3>Q: What strength do I lose without surgery?</h3>\n<blockquote>\n<p>Approximately 30-40% of forearm rotation (supination) strength and 10-20% of elbow flexion strength. This matters for tasks like using a screwdriver, opening jars, and lifting.</p>\n</blockquote>\n<h3>Q: When can I return to lifting?</h3>\n<blockquote>\n<p>Light activity at 3 months, full lifting at 5-6 months. Early overuse risks re-rupture.</p>\n</blockquote>\n<h3>Q: Will I have a scar?</h3>\n<blockquote>\n<p>Yes, a small incision at the front of the elbow, typically 2-3 inches. It fades well over time.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_tsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Total Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Damaged joint surfaces replaced with metal and plastic implants</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-2 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home the same day</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>25-30 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>Shoulder arthritis causes cartilage to wear down, leading to bone-on-bone contact, pain, and stiffness. When conservative treatments (therapy, injections, medications) no longer provide relief, Total Shoulder Replacement (TSA) restores smooth, pain-free motion by replacing the damaged ball and socket with artificial implants.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 25-30 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;25-30 lbs overhead), high-impact sports, and activities that risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Risks</h3>\n<p>Complications are rare but may include: infection, stiffness, implant loosening or wear over time, fractures around the implant, or incomplete pain relief. The benefits far outweigh the risks for most patients.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain 80% or more of their normal function with significant pain relief.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins within days of surgery and continues for 3-4 months to restore strength and motion.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>\u2705 DO</strong></td>\n<td><strong>\u274c DON\u2019T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_rsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Reverse Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Ball and socket reversed so the deltoid muscle powers the arm</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1.5-2.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home same day; overnight if needed</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>2-4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>10-15 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>When the rotator cuff is severely torn and not repairable, the shoulder loses stability and develops arthritis. A Reverse Shoulder Replacement flips the normal anatomy, placing a ball where the socket was and vice versa, allowing the deltoid muscle to compensate for the missing rotator cuff. <strong>Common reasons:</strong> irreparable cuff tear with arthritis, failed previous replacement, complex fractures, severe arthritis with instability.</p>\n<p><strong>How is this different from a standard replacement?</strong> A standard replacement requires a functioning rotator cuff. A reverse swaps the ball and socket, allowing the deltoid to power the arm when the cuff is too damaged to repair.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 10-15 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;10-15 lbs overhead), high-impact sports, and activities that
