 risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Longevity &amp; Risks</h3>\n<p>91-94% of implants survive 10+ years; 84-87% at 15 years. Rare risks include: infection, dislocation, nerve injury, component loosening, acromion fracture, or revision surgery.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain significant function and pain relief. The deltoid does the work the rotator cuff no longer can.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins 2-3 days after surgery and continues for 3-4 months.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>\u2705 DO</strong></td>\n<td><strong>\u274c DON\u2019T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Questions? 513-354-3700 | teamrolf@beaconortho.com | www.DoctorRolf.com</h3>\n<p><em>Refs: Grubhofer et al. JSES 2016. Young et al. JBJS 2020. Smith et al. JSES 2024.</em></p>\n", "sh_rcr": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Repair</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A partial or complete tear of one or more rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Rotator Cuff Tears</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>\u2022 Degenerative: gradual wear over time (most common)</p>\n<p>\u2022 Traumatic: from a fall, lifting, or sudden injury</p>\n<p>\u2022 Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>\u2022 Partial-thickness: tendon is damaged but not torn through</p>\n<p>\u2022 Full-thickness (small): &lt;1 cm tear</p>\n<p>\u2022 Full-thickness (large): 1-3 cm tear</p>\n<p>\u2022 Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>\u2022 Aching at the top or side of the shoulder</p>\n<p>\u2022 Pain worse at night, especially lying on that side</p>\n<p>\u2022 Sharp pain with overhead motions</p>\n<p>\u2022 Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>\u2022 Weakness lifting or rotating the arm</p>\n<p>\u2022 Difficulty reaching behind back (bra strap, belt)</p>\n<p>\u2022 Arm feels heavy or fatigued</p>\n<p>\u2022 Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all rotator cuff tears require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>\u2022 Physical therapy to strengthen surrounding muscles</p>\n<p>\u2022 Anti-inflammatory medications (oral or topical)</p>\n<p>\u2022 Cortisone injection for pain relief</p>\n<p>\u2022 Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>\u2022 Arthroscopic rotator cuff repair (most common)</p>\n<p>\u2022 Mini-open repair for larger tears</p>\n<p>\u2022 Tendon transfer or superior capsular reconstruction</p>\n<p>\u2022 Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_faq": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Surgery FAQ</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><h3>Frequently Asked Questions</h3>\n<p>About Shoulder Surgery</p>\n<h3>What Will My Restrictions Be After Surgery?</h3>\n<p>Your post-operative restrictions depend on the type of shoulder surgery performed. Follow these guidelines to ensure proper healing:</p>\n<h3>Rotator Cuff Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Total Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>25-30 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>Labral Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Reverse Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>6-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>10-15 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>When Can I Return to Work?</h3>\n<blockquote>\n<p>\u2022 Most patients can return to work the week after surgery, depending on their job duties.</p>\n<p>\u2022 Review the post-operative restrictions above with your employer to determine when you can safely resume work.</p>\n<p>\u2022 If your employer requires work restriction notes, we can provide them via email or fax upon request.</p>\n<p>\u2022 If your job requires lifting beyond your restrictions, your employer may either keep you off work or modify your job duties accordingly.</p>\n</blockquote>\n<h3>Will I Need Physical Therapy After Surgery?</h3>\n<p>Yes, physical therapy is required for all shoulder surgery to ensure proper recovery.</p>\n<blockquote>\n<p>\u2022 <strong>First PT Visit:</strong> 2 days after surgery for a dressing change and incision check.</p>\n</blockquote>\n<h3>Shoulder Replacements:</h3>\n<blockquote>\n<p>\u2022 PT twice a week for 6 weeks.</p>\n<p>\u2022 Then transition to once a week or every other week until 3-4 months after surgery.</p>\n</blockquote>\n<h3>Shoulder Repairs:</h3>\n<blockquote>\n<p>\u2022 Attend initial PT visit.</p>\n<p>\u2022 Return in 2-4 weeks, depending on the extent of the repair.</p>\n<p>\u2022 Your therapy schedule will be outlined on your PT script, provided on the day of surgery.</p>\n</blockquote>\n<h3>When Can I Return to Golf After Shoulder Surgery?</h3>\n<p>Your return to golf will depend on the type of shoulder surgery performed and your progress in rehabilitation.</p>\n<h3>Rotator Cuff Repair</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Total Shoulder Replacement</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~5-6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Labral Repair</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Reverse Shoulder Replacement</h3>\n<blockquote>\n<p>\u2022 <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>\u2022 <strong>Full swings:</strong> ~5-6 months</p>\n<p>\u2022 <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_calc": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Calcific Tendinitis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Calcium deposits that form inside the rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Most common ages 30-60; more frequent in women and diabetics</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Shoulder pain that can be severe and sudden, especially with overhead reach or at night</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>X-rays clearly show the calcium deposit; ultrasound or MRI can confirm</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Most cases resolve without surgery; injections, barbotage, or arthroscopy if persistent</td>\n</tr>\n</tbody>\n</table><h3>Understanding Calcific Tendinitis</h3>\n<p>For reasons that are not fully understood, the body sometimes deposits calcium inside the rotator cuff tendons, most often the supraspinatus. The deposit itself may sit quietly for months or years, but when the body begins to reabsorb it, the process can trigger intense inflammation and some of the most severe shoulder pain patients experience. The good news: this is a self-limited condition in most people, and the deposit usually resolves.</p>\n<h3>The Typical Stages</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Formative / Resting Stage</h3>\n<p>&bull; Calcium builds up inside the tendon</p>\n<p>&bull; Often mild or no symptoms</p>\n<p>&bull; May be found incidentally on X-ray</p>\n<p>&bull; Aching with overhead activity</p>\n</td>\n<td><h3>Resorptive Stage</h3>\n<p>&bull; Body begins dissolving the deposit</p>\n<p>&bull; Can cause sudden, severe pain</p>\n<p>&bull; Pain at rest and at night is common</p>\n<p>&bull; This stage means the deposit is on its way out</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Treatment Options</h3>\n<p>Treatment is matched to your symptoms. Because most deposits eventually dissolve on their own, we start conservatively and reserve procedures for deposits that will not quiet down.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>&bull; Anti-inflammatory medications</p>\n<p>&bull; Physical therapy to maintain motion and cuff strength</p>\n<p>&bull; Cortisone injection into the subacromial bursa</p>\n<p>&bull; Ultrasound-guided barbotage (needle lavage of the deposit)</p>\n</td>\n<td><h3>Surgical</h3>\n<p>&bull; Arthroscopic removal of the deposit</p>\n<p>&bull; Rotator cuff repair if the tendon needs it after removal</p>\n<p>&bull; Usually combined with subacromial decompression</p>\n<p>&bull; Reserved for persistent, failed conservative care</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Did I do something to cause this?</h3>\n<blockquote>\n<p>No. Calcific tendinitis is not caused by injury, diet, or too much calcium intake. It appears to relate to changes within the tendon cells themselves.</p>\n</blockquote>\n<h3>Q: Will the calcium go away on its own?</h3>\n<blockquote>\n<p>In the majority of patients, yes. The body reabsorbs the deposit over time. The resorptive phase can be painful, but it usually means the condition is resolving.</p>\n</blockquote>\n<h3>Q: What is barbotage?</h3>\n<blockquote>\n<p>Under ultrasound guidance and local anesthesia, a needle is used to break up and wash out the calcium deposit, and a cortisone injection is placed in the bursa. It is an office or radiology-suite procedure that avoids surgery in many patients.</p>\n</blockquote>\n<h3>Q: When is surgery needed?</h3>\n<blockquote>\n<p>If severe symptoms persist despite medications, therapy, injection, or barbotage, arthroscopic removal of the deposit is very effective. If removing the deposit leaves a defect in the tendon, it is repaired at the same time.</p>\n</blockquote>\n<h3>Q: Does this lead to a rotator cuff tear?</h3>\n<blockquote>\n<p>Usually not. The deposit sits within the tendon and most resolve without lasting damage, but large or long-standing deposits can weaken the tendon, which is one reason we monitor persistent cases.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "c_fx": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Fractures (Clavicle &amp; Proximal Humerus)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A break of the collarbone (clavicle) or the upper arm bone near the shoulder (proximal humerus)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Falls and sports injuries in younger patients; lower-energy falls in older patients with softer bone</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain, swelling, and difficulty moving the arm after an injury</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>X-rays; CT scan for complex fracture patterns</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Many heal in a sling without surgery; displaced fractures may need plate or screw fixation</td>\n</tr>\n</tbody>\n</table><h3>Understanding Shoulder Fractures</h3>\n<p>Most shoulder-area fractures involve either the clavicle (collarbone) or the proximal humerus (the ball portion of the shoulder). Whether a fracture needs surgery depends on which bone is broken, how far the pieces have shifted, your bone quality, and your activity demands. A large share of these fractures heal well without an operation.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Clavicle Fracture</h3>\n<p>&bull; Usually from a fall onto the shoulder</p>\n<p>&bull; Most heal in a sling in 6-12 weeks</p>\n<p>&bull; Surgery considered for significant shortening, separation, or skin at risk</p>\n<p>&bull; Fixed with a plate and screws when needed</p>\n</td>\n<td><h3>Proximal Humerus Fracture</h3>\n<p>&bull; Common after falls, especially over age 60</p>\n<p>&bull; Many patterns heal without surgery in a sling</p>\n<p>&bull; Displaced fractures may need plate fixation</p>\n<p>&bull; Severely broken heads in older patients may be best treated with reverse shoulder replacement</p>\n</td>\n</tr>\n</tbody>\n</table><h3>What to Expect During Healing</h3>\n<p>Bone healing takes roughly 6-12 weeks, but regaining motion and strength takes longer. Expect early follow-up X-rays to confirm the pieces are holding position, a period of sling protection, and then a structured progression: gentle pendulum motion first, active motion as the bone sticks, and strengthening last. Some stiffness is common and is treated with therapy once healing allows.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Why not just operate and fix it?</h3>\n<blockquote>\n<p>Surgery has real risks: infection, hardware irritation, nerve injury, and anesthesia. When a fracture pattern reliably heals on its own with a similar final result, a sling is the better option. We reserve surgery for patterns where it clearly improves the outcome.</p>\n</blockquote>\n<h3>Q: How long will I wear the sling?</h3>\n<blockquote>\n<p>Typically 2-6 weeks depending on the fracture and how quickly it becomes \"sticky\" on X-ray. We usually begin gentle motion early to prevent stiffness rather than waiting for complete healing.</p>\n</blockquote>\n<h3>Q: Will my fractured bone be as strong as before?</h3>\n<blockquote>\n<p>Yes. Healed bone remodels over months and regains its normal strength. The bump sometimes visible after a clavicle fracture is healing bone and typically smooths out over time.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>When you are out of the sling, off narcotic pain medication, and can control the wheel comfortably with both hands. For most patients this is several weeks after injury.</p>\n</blockquote>\n<h3>Q: What if it does not heal?</h3>\n<blockquote>\n<p>A small percentage of fractures fail to unite (nonunion) or heal in a poor position (malunion). These can be fixed surgically if they cause symptoms, which is one reason we follow your X-rays until healing is confirmed.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "c_oa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Osteoarthritis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Wear-and-tear loss of the smooth cartilage that cushions a joint</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Risk rises with age; also after injury, surgery, or years of heavy use</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Activity-related joint pain and stiffness that build gradually over years</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam plus X-rays showing joint-space narrowing, spurs, and hardened bone</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Activity modification, therapy, medications, injections; joint replacement when conservative care fails</td>\n</tr>\n</tbody>\n</table><h3>Understanding Osteoarthritis</h3>\n<p>Healthy joints glide on cartilage that is smoother than ice. In osteoarthritis, that cartilage thins and wears away, so bone begins to bear load directly. The joint responds by forming bone spurs and stiffening. The process is gradual, and symptoms often come and go in flares. Osteoarthritis is not caused by cold weather or cracking your knuckles, and while it cannot be reversed, it can almost always be managed.</p>\n<h3>What Makes It Worse and Better</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Common Aggravators</h3>\n<p>&bull; High-impact and repetitive loading</p>\n<p>&bull; Flares after unaccustomed activity</p>\n<p>&bull; Prolonged immobility (stiffness \"gels\" the joint)</p>\n<p>&bull; Weight gain for lower-extremity joints</p>\n</td>\n<td><h3>What Helps</h3>\n<p>&bull; Staying active with low-impact exercise</p>\n<p>&bull; Keeping the muscles around the joint strong</p>\n<p>&bull; Anti-inflammatory medication for flares</p>\n<p>&bull; Heat before activity, ice after</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Treatment Options</h3>\n<p>Treatment starts simple and escalates only as needed. Many patients manage arthritis for years with the measures on the left. When pain limits sleep or daily life despite them, injections and ultimately joint replacement are reliable next steps.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>&bull; Activity modification and low-impact conditioning</p>\n<p>&bull; Physical therapy and a home exercise program</p>\n<p>&bull; Acetaminophen and NSAIDs (meloxicam, ibuprofen, diclofenac)</p>\n<p>&bull; Cortisone injections for flares</p>\n</td>\n<td><h3>Surgical</h3>\n<p>&bull; Joint replacement (for the shoulder: anatomic or reverse arthroplasty)</p>\n<p>&bull; Considered when conservative care no longer controls symptoms</p>\n<p>&bull; Highly reliable pain relief and function in modern practice</p>\n<p>&bull; Timing is your choice; arthritis itself is not dangerous to leave alone</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will exercise wear my joint out faster?</h3>\n<blockquote>\n<p>No. Sensible, low-impact activity is one of the best treatments for arthritis. Motion nourishes cartilage and strong muscles shield the joint. The stiffest, most painful arthritic joints are usually the least used ones.</p>\n</blockquote>\n<h3>Q: Do injections fix the arthritis?</h3>\n<blockquote>\n<p>No injection regrows cartilage. Cortisone quiets inflammation and can give weeks to months of relief, which many patients repeat periodically. It is a management tool, not a cure.</p>\n</blockquote>\n<h3>Q: When should I consider joint replacement?</h3>\n<blockquote>\n<p>When pain interferes with sleep or the activities you care about despite medications, therapy, and injections. There is rarely urgency; waiting does not burn a bridge in most cases, and the right time is when the symptoms justify it for you.</p>\n</blockquote>\n<h3>Q: Does arthritis mean I will end up in a wheelchair?</h3>\n<blockquote>\n<p>No. Osteoarthritis progresses slowly and treatment options exist at every stage. Most patients remain active for life by adjusting activities and using the treatment ladder appropriately.</p>\n</blockquote>\n<h3>Q: Is there a diet or supplement that rebuilds cartilage?</h3>\n<blockquote>\n<p>No supplement has been proven to regrow cartilage. Glucosamine and chondroitin are safe and help some patients with symptoms. Maintaining a healthy weight has the strongest evidence of any lifestyle measure.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_instab": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Instability Surgery (Labral / Bankart Repair)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Arthroscopic reattachment of the torn labrum to the socket rim with suture anchors</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-1.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>6 weeks</td>\n</tr>\n<tr>\n<td><strong>Return to Contact Sports</strong></td>\n<td>Approximately 6 months with surgeon clearance</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>When the shoulder dislocates, the labrum (the cartilage rim that deepens the socket) tears away from the bone, most often at the front (a Bankart tear). Once torn, the labrum does not reliably heal in place, and each dislocation stretches the capsule and raises the risk of the next one, especially in young, active patients. Surgery reattaches the labrum with small suture anchors and re-tensions the capsule to restore stability.</p>\n<h3>What May Be Done at Surgery</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Core Repair</h3>\n<p>&bull; Arthroscopic Bankart (labral) repair with suture anchors</p>\n<p>&bull; Capsular tightening (plication) as needed</p>\n<p>&bull; Posterior labral repair if the tear extends backward</p>\n</td>\n<td><h3>Additions When Needed</h3>\n<p>&bull; Remplissage: filling a Hill-Sachs dent in the ball to stop it from catching</p>\n<p>&bull; Bone augmentation (e.g., Latarjet) for significant socket bone loss</p>\n<p>&bull; Biceps/SLAP treatment when the tear involves the biceps anchor</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-6</td>\n<td>Sling; gentle prescribed motion only; avoid reaching out and away from the body</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 6-12</td>\n<td>Out of sling; progressive motion; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 3-6</td>\n<td>Strength program; 10-lb limit; sport-specific training</td>\n</tr>\n<tr>\n<td>Return to Sport</td>\n<td>6+ months</td>\n<td>Contact and overhead sports with surgeon clearance</td>\n</tr>\n</tbody>\n</table><h3>First 6 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Why fix it instead of rehabbing it?</h3>\n<blockquote>\n<p>In young, active patients the redislocation rate with therapy alone is high, and every dislocation can damage more cartilage and bone. Repair dramatically lowers the recurrence risk and protects the joint long-term.</p>\n</blockquote>\n<h3>Q: What is remplissage?</h3>\n<blockquote>\n<p>Large dislocations can dent the back of the ball (a Hill-Sachs lesion). Remplissage stitches tissue into the dent so it can no longer catch on the socket rim, further reducing the redislocation risk. It is done arthroscopically at the same time as the labral repair.</p>\n</blockquote>\n<h3>Q: Will I lose motion?</h3>\n<blockquote>\n<p>A small loss of extreme external rotation is possible, which matters mainly to throwers. For most patients the trade for a stable shoulder is well worth it, and therapy restores functional motion.</p>\n</blockquote>\n<h3>Q: When can I return to contact sports?</h3>\n<blockquote>\n<p>Typically around 6 months, once strength and control match the other side and your surgeon clears you. Returning early is the most common cause of re-injury.</p>\n</blockquote>\n<h3>Q: What if I dislocate again after surgery?</h3>\n<blockquote>\n<p>Recurrence after repair is uncommon but possible, especially with early return to contact sports or significant bone loss. A recurrent dislocation is evaluated with imaging, and revision options, including bone augmentation procedures, are very effective.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_imp": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Impingement Surgery (Arthroscopic Subacromial Decompression)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Arthroscopic removal of inflamed bursa and bone spurs that pinch the rotator cuff</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 30-60 minutes</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>A few days to 2 weeks, for comfort only</td>\n</tr>\n<tr>\n<td><strong>Return to Full Activity</strong></td>\n<td>Most patients by 2-3 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The rotator cuff glides beneath the acromion (the bony roof of the shoulder), cushioned by a bursa. With impingement, bone spurs and a thickened, inflamed bursa pinch the cuff every time the arm is raised. Most patients improve with therapy and injections; surgery is for those whose symptoms persist despite good conservative care. Through small arthroscopic portals, the inflamed bursa is removed and the undersurface of the acromion is smoothed (acromioplasty) to give the cuff room to glide.</p>\n<h3>What May Be Done at Surgery</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Core Procedure</h3>\n<p>&bull; Diagnostic arthroscopy of the joint</p>\n<p>&bull; Bursectomy (removal of the inflamed bursa)</p>\n<p>&bull; Acromioplasty (smoothing the bone spur)</p>\n</td>\n<td><h3>Additions When Needed</h3>\n<p>&bull; Distal clavicle resection for AC joint arthritis</p>\n<p>&bull; Debridement of partial cuff fraying</p>\n<p>&bull; Biceps treatment if the biceps is involved</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Comfort</td>\n<td>Days 0-14</td>\n<td>Sling for comfort only; motion starts right away</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 2-6</td>\n<td>Full motion is the goal; PT and home program</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>Progressive cuff and scapular strengthening</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>2-3 months</td>\n<td>Return to overhead work and sport as symptoms allow</td>\n</tr>\n</tbody>\n</table><h3>First 2 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Why is recovery faster than a rotator cuff repair?</h3>\n<blockquote>\n<p>Nothing is sewn that must heal under protection. Since only inflamed tissue and bone spur are removed, you can move the shoulder immediately, and recovery is driven by comfort rather than tendon healing.</p>\n</blockquote>\n<h3>Q: Will the spur grow back?</h3>\n<blockquote>\n<p>Recurrence of a symptomatic spur is uncommon. Keeping the cuff and shoulder blade muscles strong is the best protection against symptoms returning.</p>\n</blockquote>\n<h3>Q: What if a cuff tear is found during surgery?</h3>\n<blockquote>\n<p>The shoulder is fully inspected during arthroscopy. If a significant tear is found, it is addressed, which can change the rehab plan. This is discussed with you before surgery as a possibility.</p>\n</blockquote>\n<h3>Q: When can I go back to work?</h3>\n<blockquote>\n<p>Desk work: a few days to a week. Light physical work: 2-4 weeks. Heavy or overhead labor: usually 6-12 weeks depending on demands.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_bt": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Biceps Tenodesis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The worn biceps tendon is detached from inside the joint and anchored to the humerus</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 45-90 minutes, often with arthroscopy</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>About 4 weeks</td>\n</tr>\n<tr>\n<td><strong>Return to Full Activity</strong></td>\n<td>Approximately 3-4 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The long head of the biceps runs through the shoulder joint and anchors to the top of the socket. It is a common source of deep, aching front-of-shoulder pain when it becomes inflamed, partially torn, or unstable in its groove, and it is frequently involved with SLAP tears and rotator cuff disease. A tenodesis detaches the worn portion from inside the joint and secures the healthy tendon to the humerus, removing the pain generator while preserving biceps strength and contour.</p>\n<h3>Tenodesis vs. Tenotomy</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Tenodesis (reattachment)</h3>\n<p>&bull; Tendon is anchored to the bone</p>\n<p>&bull; Preserves strength and muscle contour</p>\n<p>&bull; Requires ~4 weeks of protection</p>\n<p>&bull; Preferred in younger, active patients</p>\n</td>\n<td><h3>Tenotomy (release only)</h3>\n<p>&bull; Tendon is simply released</p>\n<p>&bull; Faster recovery, no repair to protect</p>\n<p>&bull; Small risk of a cosmetic \"Popeye\" bulge</p>\n<p>&bull; Often chosen in older, lower-demand patients</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-4</td>\n<td>Sling; no active elbow curling against resistance</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 4-6</td>\n<td>Out of sling; restore full shoulder and elbow motion</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>Progressive strengthening, including gentle biceps work</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>3-4 months</td>\n<td>Return to lifting and sport</td>\n</tr>\n</tbody>\n</table><h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will my biceps be weaker?</h3>\n<blockquote>\n<p>No meaningful weakness is expected after a healed tenodesis. The tendon is fixed securely to bone in a position that maintains normal biceps tension.</p>\n</blockquote>\n<h3>Q: Why not just repair the SLAP tear?</h3>\n<blockquote>\n<p>In adults beyond their athletic twenties, tenodesis is more reliable than SLAP repair, with faster recovery, less stiffness, and more predictable pain relief. It treats the same pain source at its origin.</p>\n</blockquote>\n<h3>Q: What restrictions matter most early on?</h3>\n<blockquote>\n<p>Avoid lifting with the arm and avoid resisted elbow curls for the first 6 weeks, so the tendon heals securely to the bone before it is loaded.</p>\n</blockquote>\n<h3>Q: Is it usually done alone?</h3>\n<blockquote>\n<p>Often it is combined with other arthroscopic work, such as a rotator cuff repair or decompression. When combined, the more restrictive protocol of the two procedures guides your rehab.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_clav": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Clavicle Fracture Surgery (ORIF)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The broken collarbone is realigned and fixed with a plate and screws</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-1.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Yes, outpatient</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>2-4 weeks for comfort</td>\n</tr>\n<tr>\n<td><strong>Bone Healing</strong></td>\n<td>6-12 weeks; return to contact sports usually 3-4 months</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>Many clavicle fractures heal well in a sling. Surgery is recommended when the fragments are significantly shortened or displaced, when the skin is tented at risk, in open fractures, or in higher-demand patients where a faster, more predictable recovery and restored shoulder mechanics matter. Fixation realigns the bone to its normal length and holds it with a contoured plate and screws while it heals.</p>\n<h3>Benefits and Trade-offs</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Benefits of Fixation</h3>\n<p>&bull; Restores normal length and alignment</p>\n<p>&bull; Earlier motion and use of the arm</p>\n<p>&bull; Lower nonunion rate for displaced fractures</p>\n<p>&bull; Predictable return for athletes and laborers</p>\n</td>\n<td><h3>Trade-offs</h3>\n<p>&bull; A scar over the collarbone</p>\n<p>&bull; A patch of numbness below the incision is common</p>\n<p>&bull; Hardware can be prominent under the skin</p>\n<p>&bull; Plate removal is an option after full healing if it bothers you</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-2</td>\n<td>Sling for comfort; gentle motion begins early</td>\n</tr>\n<tr>\n<td>Motion</td>\n<td>Weeks 2-6</td>\n<td>Progressive shoulder motion; light daily use of the arm</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Weeks 6-12</td>\n<td>X-rays confirm healing; progressive strengthening</td>\n</tr>\n<tr>\n<td>Full Activity</td>\n<td>3-4 months</td>\n<td>Contact sports after healed X-rays and full strength</td>\n</tr>\n</tbody>\n</table><h3>First 4 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will the plate stay in forever?</h3>\n<blockquote>\n<p>It can. The plate does not need to be removed unless it bothers you. If it is prominent or irritating, it can be removed with a short outpatient procedure after the bone is solidly healed, usually no sooner than 6-12 months.</p>\n</blockquote>\n<h3>Q: Why is part of my chest numb?</h3>\n<blockquote>\n<p>Small skin nerves cross the incision and some numbness below the scar is common. It usually shrinks over months and rarely causes functional problems.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>When you are out of the sling, off narcotic medication, and can control the wheel comfortably, often around 2-4 weeks.</p>\n</blockquote>\n<h3>Q: What are the main risks?</h3>\n<blockquote>\n<p>Infection, hardware irritation, numbness around the scar, and rarely nonunion or the need for further surgery. Not smoking and following the rehab plan are the best things you can do for healing.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>", "sh_ph": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Proximal Humerus Fracture Surgery (ORIF)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>The broken upper arm bone is realigned and fixed with a locking plate and screws</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1.5-2.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Same day or one-night stay</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>4-6 weeks</td>\n</tr>\n<tr>\n<td><strong>Recovery</strong></td>\n<td>Bone heals by ~12 weeks; strength and motion continue improving up to a year</td>\n</tr>\n</tbody>\n</table><h3>Why Consider Surgery?</h3>\n<p>The proximal humerus is the ball portion of the shoulder. Many of these fractures heal without surgery, but when the fragments are significantly displaced or the ball has split, fixation restores the anatomy so the shoulder can regain motion and strength. A locking plate holds the fragments while the bone heals; in severe patterns in older patients, replacement (usually a reverse shoulder) can be the more reliable choice, and this is discussed before surgery.</p>\n<h3>What Affects the Plan</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Favoring Fixation (ORIF)</h3>\n<p>&bull; Good bone quality</p>\n<p>&bull; Fracture pieces can be realigned and held</p>\n<p>&bull; Younger or higher-demand patients</p>\n<p>&bull; Ball has a good blood supply</p>\n</td>\n<td><h3>Favoring Replacement Instead</h3>\n<p>&bull; Severely fragmented ball or poor bone</p>\n<p>&bull; Fracture-dislocations in older patients</p>\n<p>&bull; Pre-existing rotator cuff failure or arthritis</p>\n<p>&bull; Patterns with high risk of the ball losing blood supply</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 0-2</td>\n<td>Sling; pendulum exercises and hand/wrist/elbow motion</td>\n</tr>\n<tr>\n<td>Early Motion</td>\n<td>Weeks 2-6</td>\n<td>Gentle assisted motion as X-rays confirm the fixation is holding</td>\n</tr>\n<tr>\n<td>Active Motion</td>\n<td>Weeks 6-12</td>\n<td>Sling weaned; active motion progresses; light use of the arm</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 3-6+</td>\n<td>Strengthening once healed; function improves up to a year</td>\n</tr>\n</tbody>\n</table><h3>First 6 Weeks: Do\u2019s and Don\u2019ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>&#9989; DO</h3>\n<p>&bull; Ice your shoulder 20 min on / 20 min off</p>\n<p>&bull; Take aspirin 81 mg twice daily for 4 weeks as prescribed</p>\n<p>&bull; Wear your sling as instructed</p>\n<p>&bull; Begin PT exercises as directed</p>\n<p>&bull; Use the opposite arm for daily tasks</p>\n</td>\n<td><h3>&#10060; DON\u2019T</h3>\n<p>&bull; Lift anything with your surgical arm</p>\n<p>&bull; Drive while in the sling or on narcotic pain medication</p>\n<p>&bull; Submerge the incision in water (no pools/baths) until cleared</p>\n<p>&bull; Remove your sling without instructions</p>\n<p>&bull; Smoke or use nicotine (impairs healing)</p>\n</td>\n</tr>\n</tbody>\n</table><h3>Frequently Asked Questions</h3>\n<h3>Q: Will my shoulder be stiff?</h3>\n<blockquote>\n<p>Some stiffness is the most common issue after this fracture, with or without surgery. Early guided motion and consistent therapy are the best defense, and most patients regain very functional motion.</p>\n</blockquote>\n<h3>Q: Why do I need so many X-rays?</h3>\n<blockquote>\n<p>Follow-up X-rays confirm the fragments and hardware are holding position while the bone heals and catch problems early, when they are easiest to address.</p>\n</blockquote>\n<h3>Q: What is avascular necrosis?</h3>\n<blockquote>\n<p>In some fracture patterns the blood supply to the ball is damaged, and part of it can slowly collapse over months to years. If that occurs and causes pain, conversion to a shoulder replacement is an effective solution.</p>\n</blockquote>\n<h3>Q: Will the plate need to come out?</h3>\n<blockquote>\n<p>Usually not. Removal is reserved for hardware that irritates or a screw that becomes prominent, and only after the bone is fully healed.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>"};</script>
