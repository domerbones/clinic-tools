  { label:'Calcific tendinitis — follow-up', group:'Follow-up', picks:['pt_cont','fu_6wk'], note:'Repeat subacromial injection if it helped; consider US-guided barbotage or surgery if persistent.' },
  { label:'Instability / dislocation — follow-up', group:'Follow-up', picks:['pt_cont','fu_6wk'], note:'If recurrent → MR arthrogram and surgical stabilization discussion (Bankart / Latarjet).' },
  { label:'Rotator cuff arthropathy — follow-up', group:'Follow-up', picks:['pt_cont','fu_6wk'], note:'GH injection if symptomatic; reverse arthroplasty discussion when failing.' }
];

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function v(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function ck(id){ var e=document.getElementById(id); return !!(e&&e.checked); }
// ---- multi-add dropdown sections (e.g., surgical handouts) ----
var multiSel = {};
function multiAdd(key){
  var sel=document.getElementById('dd_'+key); var val=sel.value; sel.value='';
  if(!val) return;
  if(!multiSel[key]) multiSel[key]=[];
  if(multiSel[key].indexOf(val)===-1) multiSel[key].push(val);
  renderMulti(key);
}
function multiRemove(key,i){ multiSel[key].splice(i,1); renderMulti(key); }
function renderMulti(key){
  var sec=SEC_BY_KEY[key]; var box=document.getElementById('chips_'+key); if(!box) return;
  box.innerHTML=(multiSel[key]||[]).map(function(id,i){
    var it=sec.items.filter(function(x){ return x[0]===id; })[0];
    return '<span class="mchip">'+esc(it?it[1]:id)+' <span class="x" onclick="multiRemove(\''+key+'\','+i+')">×</span></span>';
  }).join('');
}
// B is exclusive: checking B clears R/L, and checking R or L clears B
function latSide(base, w){
  var r=document.getElementById('chk_'+base+'_R'), l=document.getElementById('chk_'+base+'_L'), bi=document.getElementById('chk_'+base+'_B');
  if(w==='B' && bi.checked){ r.checked=false; l.checked=false; }
  else if((w==='R'&&r.checked)||(w==='L'&&l.checked)){ bi.checked=false; }
}
function lowerFirst(s){ return /^[A-Z][a-z]/.test(s) ? s.charAt(0).toLowerCase()+s.slice(1) : s; } // leaves acronyms like "AC" alone
function fmtDate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? (+m[2])+'/'+(+m[3])+'/'+m[1] : s; } // yyyy-mm-dd -> m/d/yyyy
function pickedLabels(key){
  var sec=SEC_BY_KEY[key]; if(!sec) return [];
  if(sec.dropdown){
    var sel=v('dd_'+key); if(!sel) return [];
    var it=sec.items.filter(function(x){ return x[0]===sel; })[0];
    return it ? [it[1]] : [];
  }
  if(sec.multi){
    return (multiSel[key]||[]).map(function(id){ var it=sec.items.filter(function(x){ return x[0]===id; })[0]; return it?it[1]:id; });
  }
  if(sec.weightDrop){
    var out2=[]; var wv=v('dd_weight');
    if(wv){ var wit=sec.items.filter(function(x){ return x[0]===wv; })[0]; if(wit) out2.push(wit[1]); }
    sec.items.forEach(function(it,i){
      if(i<sec.weightDrop) return;
      if(ck('chk_'+it[0])){ var t=it[1]; if(it[2]){ var iv=v(it[0]+'_val'); if(it[2]==='date') iv=fmtDate(iv); t+=' '+(iv||'______'); } out2.push(t); }
    });
    return out2;
  }
  if(sec.lat){
    // laterality rows: include the item if any side box is checked, with a side prefix
    var out=[];
    sec.items.forEach(function(it){
      var r=ck('chk_'+it[0]+'_R'), l=ck('chk_'+it[0]+'_L'), bi=ck('chk_'+it[0]+'_B');
      if(!(r||l||bi)) return;
      var side=(bi||(r&&l))?'Bilateral':(r?'Right':'Left');
      out.push(side+' '+lowerFirst(it[1]));
    });
    return out;
  }
  return sec.items.filter(function(it){ var c=document.getElementById('chk_'+it[0]); return c&&c.checked; }).map(function(it){ return it[1]; });
}

// ---------- render ----------
function renderForm(){
  var L='', R='';
  SECTIONS.forEach(function(sec){
    var s='<div class="formsec"><div class="section-title">'+esc(sec.title)+(sec.lat?' <small>(check R / L / B per injection)</small>':'')+'</div>';
    if(sec.dropdown){
      s+='<select class="dd" id="dd_'+sec.key+'"><option value="">— none —</option>';
      sec.items.forEach(function(it){ s+='<option value="'+it[0]+'">'+esc(it[1])+'</option>'; });
      s+='</select></div>';
      if(sec.col==='R') R+=s; else L+=s;
      return;
    }
    if(sec.multi){
      // dropdown that ADDS a removable tag each time (more than one allowed)
      s+='<select class="dd" id="dd_'+sec.key+'" onchange="multiAdd(\''+sec.key+'\')"><option value="">+ add…</option>';
      sec.items.forEach(function(it){ s+='<option value="'+it[0]+'">'+esc(it[1])+'</option>'; });
      s+='</select><div class="mchips" id="chips_'+sec.key+'"></div></div>';
      if(sec.col==='R') R+=s; else L+=s;
      return;
    }
    var start=0;
    if(sec.weightDrop){
      // first N items are the weight limits -> one dropdown instead of checkboxes
      start=sec.weightDrop;
      s+='<select class="dd" id="dd_weight" style="margin-bottom:6px"><option value="">— weight limit: none —</option>';
      for(var wi=0; wi<sec.weightDrop; wi++){ s+='<option value="'+sec.items[wi][0]+'">'+esc(sec.items[wi][1])+'</option>'; }
      s+='</select>';
    }
    sec.items.forEach(function(it,i){
      if(i<start) return;
      if(sec.lat){
        // one row per item with independent R / L / B side boxes
        s+='<div class="latrow"><span class="lname">'+esc(it[1])+'</span><span class="latboxes">'+
           '<label class="lat"><input type="checkbox" id="chk_'+it[0]+'_R" onchange="latSide(\''+it[0]+'\',\'R\')">R</label>'+
           '<label class="lat"><input type="checkbox" id="chk_'+it[0]+'_L" onchange="latSide(\''+it[0]+'\',\'L\')">L</label>'+
           '<label class="lat"><input type="checkbox" id="chk_'+it[0]+'_B" onchange="latSide(\''+it[0]+'\',\'B\')">B</label></span></div>';
      } else {
        s+='<label class="chk"><input type="checkbox" id="chk_'+it[0]+'"><span>'+esc(it[1])+'</span>';
        if(it[2]){ s+=' <input class="mini'+(it[2]==='date'?' mdate':'')+'"'+(it[2]==='date'?' type="date"':'')+' id="'+it[0]+'_val" placeholder="'+esc(it[2])+'">'; }
        s+='</label>';
      }
    });
    s+='</div>';
    if(sec.col==='R') R+=s; else L+=s;
  });
  document.getElementById('form-root').innerHTML='<div class="cols"><div class="col">'+L+'</div><div class="col">'+R+'</div></div>';
}

// ---------- visit-type / diagnosis cascade ----------
function onVisitTypeChange(){
  var vt=document.getElementById('vtype-sel').value, dx=document.getElementById('dx-sel');
  if(vt===''){ dx.style.display='none'; return; }
  // new patient and established-new-problem use the same New-visit standards
  populateDx(vt==='fu' ? 'Follow-up' : 'New visit');
  dx.style.display=''; dx.selectedIndex=0;
}
// Most-used diagnoses pinned to the top of the dropdown
var TOP_DX=['Glenohumeral arthritis','Rotator cuff arthropathy','Rotator cuff tear'];
function populateDx(group){
  var dx=document.getElementById('dx-sel');
  var h='<option value="">— select diagnosis —</option>';
  var entries=[];
  PRESETS.forEach(function(pr,i){ if(pr.group===group){ entries.push({i:i, base:pr.label.replace(/ — follow-up$/i,'')}); } });
  entries.sort(function(a,b){
    function rank(e){ if(e.base==='Follow-up (generic)') return -1; var t=TOP_DX.indexOf(e.base); return t>=0 ? t : TOP_DX.length+1; }
    return rank(a)-rank(b);  // stable sort: everything else keeps its existing order
  });
  entries.forEach(function(e){ h+='<option value="'+e.i+'">'+esc(e.base)+'</option>'; });
  dx.innerHTML=h;
}
function applyDxPreset(){
  var val=document.getElementById('dx-sel').value; if(val==='') return;
  applyPreset(parseInt(val,10));
}
function applyPreset(idx){
  // clear all checkboxes + notes, then apply
  document.querySelectorAll('#form-root input[type=checkbox]').forEach(function(c){ c.checked=false; });
  document.getElementById('p-other').value='';
  var pr=PRESETS[idx]; if(!pr) return;
  // reset dropdown fields (condition, follow-up, weight limit), inline inputs, and multi-add tags
  document.querySelectorAll('#form-root select.dd').forEach(function(d){ d.value=''; });
  document.querySelectorAll('#form-root input:not([type=checkbox])').forEach(function(i){ i.value=''; });
  SECTIONS.forEach(function(sec){ if(sec.multi){ multiSel[sec.key]=[]; renderMulti(sec.key); } });
  (pr.picks||[]).forEach(function(id){
    var c=document.getElementById('chk_'+id);
    if(c){ c.checked=true; return; }
    // dropdown / multi-add / weight-limit items
    var placed=false;
    SECTIONS.forEach(function(sec){
      if(placed) return;
      if(sec.dropdown && sec.items.some(function(x){ return x[0]===id; })){ var d=document.getElementById('dd_'+sec.key); if(d){ d.value=id; placed=true; } }
      else if(sec.multi && sec.items.some(function(x){ return x[0]===id; })){ multiSel[sec.key]=multiSel[sec.key]||[]; if(multiSel[sec.key].indexOf(id)===-1) multiSel[sec.key].push(id); renderMulti(sec.key); placed=true; }
      else if(sec.weightDrop && sec.items.slice(0,sec.weightDrop).some(function(x){ return x[0]===id; })){ var dw=document.getElementById('dd_weight'); if(dw){ dw.value=id; placed=true; } }
    });
    if(placed) return;
    // laterality item (injections): check the side box matching the Side field
    var side=v('p-side')||'Right';
    var sfx=side==='Bilateral'?'B':(side==='Left'?'L':'R');
    var cs=document.getElementById('chk_'+id+'_'+sfx); if(cs) cs.checked=true;
  });
  if(pr.note) document.getElementById('p-other').value=pr.note;
}

// current visit type / diagnosis labels for output
function vtypeLabel(){ var s=document.getElementById('vtype-sel'); return (s && s.value!=='') ? s.options[s.selectedIndex].text : ''; }
function dxLabel(){ var s=document.getElementById('dx-sel'); return (s && s.value!=='' && s.style.display!=='none') ? s.options[s.selectedIndex].text : ''; }

// ---------- generate ----------
function generate(){
  buildProvider();
  buildPatient();
  buildAttachments();
  var p=document.getElementById('output-panel'); p.classList.add('active');
  try{ p.scrollIntoView({behavior:'smooth'}); }catch(e){}
}

// Selected handouts that have embedded content (condition + surgical)
function selectedHandouts(){
  var att=[];
  ['condition','shandout'].forEach(function(k){
    (multiSel[k]||[]).forEach(function(id){
      if(!HANDOUT_HTML[id]) return;
      var sec=SEC_BY_KEY[k]; var it=sec.items.filter(function(x){ return x[0]===id; })[0];
      att.push({id:id, t:it?it[1].replace(/ information guide$/i,'').replace(/ handout$/i,''):id});
    });
  });
  return att;
}
// Show which handouts will be included in the merged print
function buildAttachments(){
  var att=selectedHandouts();
  var ab=document.getElementById('attach-block'), al=document.getElementById('attach-list');
  if(att.length){
    al.innerHTML=att.map(function(a){ return '<span class="attach-link">&#128196; '+esc(a.t)+'</span>'; }).join('');
    ab.style.display='block';
  } else { ab.style.display='none'; al.innerHTML=''; }
}

// ---- merged print: the handout text is embedded in this file; append it to the printable summary ----
function appendHandoutDocs(){
  var old=document.getElementById('hp-pages');
  if(old) old.parentNode.removeChild(old);
  var att=selectedHandouts();
  if(!att.length) return;
  var box=document.createElement('div'); box.id='hp-pages';
  att.forEach(function(a){
    var d=document.createElement('div'); d.className='hp-doc';
    d.innerHTML=HANDOUT_HTML[a.id];
    box.appendChild(d);
  });
  document.getElementById('handout').appendChild(box);
}
function printPatientAll(){
  appendHandoutDocs();
  printAs('pp-patient');
}

function buildProvider(){
  var name=v('p-name')||'[patient]', date=v('p-date'), side=v('p-side'), dob=v('p-mrn');
  var vt=vtypeLabel(), dx=dxLabel();
  var h='<div class="doc-header"><div class="doc-practice">Provider Note</div>';
  h+='<div class="doc-sub">'+esc(name)+(dob?' &middot; DOB '+esc(dob):'')+(date?' &middot; '+esc(date):'')+' &middot; Robert H. Rolf, MD</div></div>';
  var head=(vt?esc(vt)+' visit':'Visit');
  if(dx) head+=' &mdash; '+esc(dx)+(side?' ('+esc(side)+')':'');
  h+='<div class="doc-sec"><p>'+head+'.</p></div>';
  // plan grouped by section (follow-up handled separately)
  var lines=[];
  SECTIONS.forEach(function(sec){ if(sec.key==='fu') return; var p=pickedLabels(sec.key); if(p.length) lines.push({label:sec.title, text:p.join(', ')}); });
  if(lines.length){ h+='<div class="doc-sec"><h3>Plan</h3><ul>'; lines.forEach(function(l){ h+='<li><b>'+esc(l.label)+':</b> '+esc(l.text)+'</li>'; }); h+='</ul></div>'; }
  var fu=pickedLabels('fu'); if(fu.length) h+='<div class="doc-sec"><h3>Follow-up</h3><p>'+esc(fu.join('; '))+'.</p></div>';
  var other=v('p-other'); if(other) h+='<div class="doc-sec"><h3>Note</h3><p>'+esc(other)+'</p></div>';
  document.getElementById('provider').innerHTML=h;
}

function docSec(title, body){ return '<div class="doc-sec"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p></div>'; }
function buildPatient(){
  var name=v('p-name')||'[patient]', date=v('p-date'), side=v('p-side'), dx=dxLabel(), dob=v('p-mrn');
  var h='<div class="doc-header"><div class="doc-practice">Beacon Orthopaedics</div>';
  h+='<div class="doc-title">Visit Summary</div><div class="doc-sub">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>';
  h+='<table class="doc-table"><tr><td class="k">Patient</td><td>'+esc(name)+'</td><td class="k">DOB</td><td>'+esc(dob||'—')+'</td></tr>';
  h+='<tr><td class="k">Date</td><td colspan="3">'+esc(date||'—')+'</td></tr>';
  if(dx) h+='<tr><td class="k">Diagnosis</td><td colspan="3">'+esc(dx)+(side?' ('+esc(side)+')':'')+'</td></tr>';
  h+='</table>';
  var inj=pickedLabels('inj'); if(inj.length) h+=docSec('Injection today', inj.join('; ')+'. Mild soreness for 1–2 days is normal; ice helps.');
  if(pickedLabels('condition').length) h+=docSec('Your condition', 'We gave you an information sheet about your condition.');
  var img=pickedLabels('img'); if(img.length) h+=docSec('Tests ordered', img.join(', ')+'. Our office will call you to schedule.');
  var meds=pickedLabels('meds'); if(meds.length) h+=docSec('Medications', meds.join('; ')+'.');
  var pt=pickedLabels('pt'); if(pt.length) h+=docSec('Physical therapy', pt.join('; ')+'.');
  var res=pickedLabels('restrict'); if(res.length) h+=docSec('Activity', res.join('; ')+'.');
  var dme=pickedLabels('dme'); if(dme.length) h+=docSec('Brace / sling', dme.join(', ')+'.');
  var surg=pickedLabels('surg'); if(surg.length) h+=docSec('Surgery', 'We discussed: '+surg.join('; ')+'.');
  var sh=pickedLabels('shandout'); if(sh.length) h+=docSec('Surgery information', 'We gave you: '+sh.join(', ')+'.');
  var fu=pickedLabels('fu'); if(fu.length) h+=docSec('Follow-up', fu.join(', ')+'.');
  var other=v('p-other'); if(other) h+=docSec('Notes', other);
  h+='<div class="doc-sec doc-warn"><h3>When to call the office — (513) 354-3700</h3><p>Call for worsening or severe pain, fever, spreading redness or drainage, new numbness or weakness, or any concern. For chest pain or shortness of breath, call 911.</p></div>';
  h+='<div class="doc-contact"><span class="lbl">Questions? Contact</span> Team Rolf &nbsp;&bull;&nbsp; (513) 354-3700 &nbsp;&bull;&nbsp; Teamrolf@beaconortho.com &nbsp;&bull;&nbsp; doctorrolf.com</div>';
  document.getElementById('handout').innerHTML=h;
}

// ---------- copy / print / clear ----------
function fallbackCopy(text){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
function copyEl(elId, msgId){
  var text=document.getElementById(elId).innerText;
  var done=function(){ var m=document.getElementById(msgId); if(m){ m.style.display='inline'; setTimeout(function(){ m.style.display='none'; },2000); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); }); } else { fallbackCopy(text); done(); }
}
function copyProvider(){ copyEl('provider','copy-msg-p'); }
function copyPatient(){ copyEl('handout','copy-msg'); }
function printAs(cls){ document.body.classList.add(cls); window.print(); document.body.classList.remove(cls); }
function printProvider(){ printAs('pp-provider'); }
function printPatient(){ printAs('pp-patient'); }

function clearAll(){
  document.querySelectorAll('#form-root input[type=checkbox]').forEach(function(c){ c.checked=false; });
  document.querySelectorAll('#form-root input:not([type=checkbox])').forEach(function(i){ i.value=''; });
  document.querySelectorAll('#form-root select.dd').forEach(function(d){ d.value=''; });
  SECTIONS.forEach(function(sec){ if(sec.multi){ multiSel[sec.key]=[]; renderMulti(sec.key); } });
  ['p-name','p-mrn','p-other'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('p-side').selectedIndex=0;
  document.getElementById('vtype-sel').selectedIndex=0;
  var dx=document.getElementById('dx-sel'); dx.style.display='none'; dx.innerHTML='<option value="">— select diagnosis —</option>';
  setToday();
  document.getElementById('output-panel').classList.remove('active');
}
function setToday(){ var d=new Date(); document.getElementById('p-date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

renderForm(); setToday();
</script>
