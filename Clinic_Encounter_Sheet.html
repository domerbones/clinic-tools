<style>

<body>
<div class="header"><h1>Clinic Encounter Sheet</h1><span>Robert H. Rolf, MD | Beacon Orthopaedics</span></div>
<div class="container">
  <div class="panel">
    <div class="section-title">Patient &amp; Encounter</div>
    <div class="row">
      <div class="field"><label>Patient Name</label><input id="p-name"></div>
      <div class="field" style="max-width:160px"><label>DOB</label><input id="p-mrn" placeholder="mm/dd/yyyy"></div>
      <div class="field" style="max-width:150px"><label>Date</label><input id="p-date" type="date"></div>
      <div class="field" style="max-width:140px"><label>Side</label><select id="p-side"><option>Right</option><option>Left</option><option>Bilateral</option></select></div>
    </div>

    <div class="section-title">Visit type &amp; diagnosis</div>
    <div class="row">
      <div class="field picker" style="max-width:260px"><label>Visit type</label>
        <select id="vtype-sel" onchange="onVisitTypeChange()">
          <option value="">— select visit type —</option>
          <option value="new">New patient</option>
          <option value="estab">Established patient — new problem</option>
          <option value="fu">Follow-up</option>
        </select></div>
      <div class="field picker" style="max-width:320px"><label>Diagnosis</label>
        <select id="dx-sel" onchange="applyDxPreset()" style="display:none"><option value="">— select diagnosis —</option></select></div>
    </div>

    <div id="form-root"></div>

    <div class="section-title">Other / free-text notes</div>
    <textarea class="freebox" id="p-other" placeholder="Anything not captured above..."></textarea>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generate()">Generate</button>
      <button class="btn btn-outline" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div class="output-panel" id="output-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      <h2 style="color:#1B3A6B;">Output</h2>
      <button class="btn btn-outline" onclick="document.getElementById('output-panel').classList.remove('active')">Close</button>
    </div>
    <div class="outblock">
      <div class="outhead"><span>Provider note — for Athena</span>
        <span class="btns"><button class="btn btn-secondary" onclick="copyProvider()">Copy</button>
        <button class="btn btn-outline" onclick="printProvider()">Print</button>
        <span class="copied-msg" id="copy-msg-p">Copied!</span></span></div>
      <div class="provider" id="provider" contenteditable="true" spellcheck="false"></div>
    </div>
    <div class="outblock">
      <div class="outhead"><span>Patient handout — print &amp; give</span>
        <span class="btns"><button class="btn btn-secondary" onclick="copyPatient()">Copy</button>
        <button class="btn btn-primary" id="printall-btn" onclick="printPatientAll()">Print + handouts</button>
        <button class="btn btn-outline" onclick="printPatient()">Print</button>
        <span class="copied-msg" id="copy-msg">Copied!</span></span></div>
      <div class="handout" id="handout" contenteditable="true" spellcheck="false"></div>
    </div>
    <div class="outblock" id="attach-block" style="display:none">
      <div class="outhead"><span>Handouts included with "Print + handouts"</span></div>
      <div id="attach-list"></div>
    </div>
  </div>
</div>

<script id="handout-data">var HANDOUT_HTML = {"c_gh": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Glenohumeral Osteoarthritis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Wear-and-tear arthritis of the ball-and-socket shoulder joint</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Most common in adults over 50; may follow injury or overuse</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Shoulder stiffness and pain that worsens with activity over time</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays showing joint space narrowing and bone spurs</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Total Shoulder Replacement when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The cartilage that cushions the ball-and-socket joint of the shoulder wears down over time. As the protective surface thins, bones begin to rub against each other, causing pain, stiffness, and loss of motion. Prior injuries, rotator cuff disease, and inflammatory conditions can accelerate this process.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Stiffness and difficulty moving the joint</p>\n<p>• Pain that worsens with activity</p>\n<p>• Aching at rest or at night</p>\n<p>• Grinding, clicking, or popping</p></td>\n<td><h3>Function</h3>\n<p>• Limited range of motion</p>\n<p>• Difficulty reaching overhead or behind the back</p>\n<p>• Pain putting on a seatbelt or coat</p>\n<p>• Progressive worsening over months to years</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>• Activity modification to reduce painful motions</p>\n<p>• Physical therapy for motion and strength</p>\n<p>• OTC medications (Tylenol, NSAIDs)</p>\n<p>• Corticosteroid injections</p>\n<p>• Heat or ice for symptom management</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>• Arthroscopic debridement (cleaning the joint)</p>\n<p>• Total Shoulder Replacement (TSA)</p>\n<p>• Replaces ball and socket with implants</p>\n<p>• See separate TSA handout for details</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will shoulder arthritis get worse over time?</h3>\n<blockquote>\n<p>Yes, osteoarthritis is progressive. The rate varies, but cartilage loss continues gradually. Treatment focuses on slowing progression and managing pain.</p>\n</blockquote>\n<h3>Q: Can exercise help or does it make it worse?</h3>\n<blockquote>\n<p>The right exercises help. Physical therapy strengthens supporting muscles and preserves motion. Avoid high-impact activities that increase joint stress.</p>\n</blockquote>\n<h3>Q: How do I know when it's time for surgery?</h3>\n<blockquote>\n<p>When pain limits your daily activities, sleep, or quality of life despite consistent conservative treatment, it may be time to discuss surgical options.</p>\n</blockquote>\n<h3>Q: Is shoulder replacement a major surgery?</h3>\n<blockquote>\n<p>It is a significant procedure, but most patients go home the same day and experience substantial pain relief. See the separate TSA handout for full recovery details.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_rca": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Arthropathy</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Shoulder arthritis caused by a large, irreparable rotator cuff tear</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Older adults and those with long-standing untreated cuff tears</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain and weakness with overhead use; grinding in the joint</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays (MRI if needed)</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Reverse Shoulder Replacement when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The rotator cuff is a group of muscles and tendons that stabilize the shoulder and allow you to lift and rotate your arm. When a rotator cuff tear is large and left untreated, the humeral head (ball) migrates upward and grinds against the acromion. Over time this causes cartilage loss and arthritis in the joint.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Deep ache in the shoulder</p>\n<p>• Worse with overhead activity</p>\n<p>• Night pain disrupting sleep</p>\n<p>• Pain at rest in advanced cases</p></td>\n<td><h3>Function</h3>\n<p>• Weakness lifting the arm</p>\n<p>• Cannot actively raise arm (passive motion may remain)</p>\n<p>• Grinding, popping, or catching</p>\n<p>• Difficulty with daily tasks (combing hair, dressing)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Early Stage)</h3>\n<p>• Physical therapy for strength and mobility</p>\n<p>• Activity modification</p>\n<p>• Anti-inflammatory medications (NSAIDs)</p>\n<p>• Corticosteroid injections for temporary relief</p></td>\n<td><h3>Surgical (Advanced)</h3>\n<p>• Reverse Shoulder Replacement: most common surgical treatment</p>\n<p>• Deltoid muscle compensates for missing cuff</p>\n<p>• Restores function and reduces pain</p>\n<p>• See separate RSA handout for details</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Large tears generally do not heal without surgery. However, many patients manage symptoms successfully with therapy and injections.</p>\n</blockquote>\n<h3>Q: Is this different from a regular rotator cuff tear?</h3>\n<blockquote>\n<p>Yes. Rotator cuff arthropathy means the tear has been present long enough to cause arthritis in the joint, not just tendon damage.</p>\n</blockquote>\n<h3>Q: What happens if I don't have surgery?</h3>\n<blockquote>\n<p>The condition typically progresses slowly. Conservative treatment can manage pain, but function may continue to decline over time.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes, regardless of surgical or non-surgical treatment. Physical therapy is essential to maintain strength, mobility, and function in the shoulder.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_rc": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A partial or complete tear of one or more rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Rotator Cuff Tears</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>• Degenerative: gradual wear over time (most common)</p>\n<p>• Traumatic: from a fall, lifting, or sudden injury</p>\n<p>• Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>• Partial-thickness: tendon is damaged but not torn through</p>\n<p>• Full-thickness (small): &lt;1 cm tear</p>\n<p>• Full-thickness (large): 1-3 cm tear</p>\n<p>• Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Aching at the top or side of the shoulder</p>\n<p>• Pain worse at night, especially lying on that side</p>\n<p>• Sharp pain with overhead motions</p>\n<p>• Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>• Weakness lifting or rotating the arm</p>\n<p>• Difficulty reaching behind back (bra strap, belt)</p>\n<p>• Arm feels heavy or fatigued</p>\n<p>• Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all rotator cuff tears require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>• Physical therapy to strengthen surrounding muscles</p>\n<p>• Anti-inflammatory medications (oral or topical)</p>\n<p>• Cortisone injection for pain relief</p>\n<p>• Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>• Arthroscopic rotator cuff repair (most common)</p>\n<p>• Mini-open repair for larger tears</p>\n<p>• Tendon transfer or superior capsular reconstruction</p>\n<p>• Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_imp": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Impingement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Pinching of the tendons and bursa in the shoulder joint space</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Shoulder Impingements</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>• Degenerative: gradual wear over time (most common)</p>\n<p>• Traumatic: from a fall, lifting, or sudden injury</p>\n<p>• Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>• Partial-thickness: tendon is damaged but not torn through</p>\n<p>• Full-thickness (small): &lt;1 cm tear</p>\n<p>• Full-thickness (large): 1-3 cm tear</p>\n<p>• Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Aching at the top or side of the shoulder</p>\n<p>• Pain worse at night, especially lying on that side</p>\n<p>• Sharp pain with overhead motions</p>\n<p>• Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>• Weakness lifting or rotating the arm</p>\n<p>• Difficulty reaching behind back (bra strap, belt)</p>\n<p>• Arm feels heavy or fatigued</p>\n<p>• Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all shoulder impingement require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>• Physical therapy to strengthen surrounding muscles</p>\n<p>• Anti-inflammatory medications (oral or topical)</p>\n<p>• Cortisone injection for pain relief</p>\n<p>• Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>• Arthroscopic rotator cuff repair (most common)</p>\n<p>• Mini-open repair for larger tears</p>\n<p>• Tendon transfer or superior capsular reconstruction</p>\n<p>• Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_ac": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">AC Joint Arthritis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Arthritis of the small joint at the top of the shoulder (acromioclavicular)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead workers, weightlifters, athletes, and adults with prior AC injuries</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain at the top of the shoulder, especially reaching across the body</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + X-rays (tenderness directly over the AC joint)</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Distal Clavicle Excision (DCR) if conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The AC joint is where the collarbone meets the top of the shoulder blade (acromion). The cartilage in this small joint wears down from repetitive overhead use, prior separations, or normal aging. As cartilage thins, bone-on-bone contact causes pain and sometimes a visible bump at the joint.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Pain at the top of the shoulder</p>\n<p>• Worse with lifting, reaching across body</p>\n<p>• Tenderness directly over the AC joint</p>\n<p>• Pain with cross-body movements (seatbelt)</p></td>\n<td><h3>Function</h3>\n<p>• Clicking, popping, or grinding</p>\n<p>• Visible bump over the joint (advanced cases)</p>\n<p>• Difficulty with bench press or push-ups</p>\n<p>• Pain sleeping on the affected side</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>• Activity modification (avoid aggravating motions)</p>\n<p>• NSAIDs (ibuprofen, naproxen)</p>\n<p>• Ice or heat for comfort</p>\n<p>• Physical therapy for mechanics</p>\n<p>• Corticosteroid injection into the AC joint</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>• Distal Clavicle Excision (DCR)</p>\n<p>• Removes a small portion of collarbone end</p>\n<p>• Eliminates bone-on-bone contact</p>\n<p>• Typically done arthroscopically</p>\n<p>• Short recovery compared to other shoulder surgeries</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Can I still lift weights with AC joint arthritis?</h3>\n<blockquote>\n<p>You may need to modify your routine. Avoid exercises that compress the AC joint (bench press, overhead press, dips) and focus on movements that don't aggravate pain.</p>\n</blockquote>\n<h3>Q: How long does recovery take after DCR surgery?</h3>\n<blockquote>\n<p>Most patients use a sling for 1-2 weeks and return to desk work within days. Full return to lifting typically takes 6-12 weeks.</p>\n</blockquote>\n<h3>Q: Will a cortisone injection cure it?</h3>\n<blockquote>\n<p>Injections provide temporary relief (weeks to months) but do not reverse the arthritis. They are useful for confirming the diagnosis and managing flare-ups.</p>\n</blockquote>\n<h3>Q: Is AC joint arthritis the same as shoulder arthritis?</h3>\n<blockquote>\n<p>No. The AC joint is a separate, small joint at the top of the shoulder. Glenohumeral (shoulder) arthritis affects the main ball-and-socket joint and is a different condition with different treatment.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_bt": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Biceps Tendinitis</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Inflammation or irritation of the long head of the biceps tendon in the shoulder</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead athletes, workers with repetitive arm use, adults over 40</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain at the front of the shoulder, worse with lifting or overhead reaching</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam (Speed's test, Yergason's test) + MRI if needed</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Biceps tenodesis or tenotomy when conservative care fails</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The long head of the biceps tendon runs through a groove at the front of the shoulder and attaches inside the joint. Repetitive overhead motion, heavy lifting, or age-related degeneration causes the tendon to become inflamed, frayed, or partially torn. Biceps tendinitis often occurs alongside other shoulder problems such as rotator cuff disease, impingement, or labral tears.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Aching at the front of the shoulder</p>\n<p>• Worse with overhead reaching or lifting</p>\n<p>• Pain carrying objects with the arm extended</p>\n<p>• Tenderness in the bicipital groove</p></td>\n<td><h3>Function</h3>\n<p>• Weakness with elbow flexion or supination</p>\n<p>• Snapping or popping at the front of the shoulder</p>\n<p>• Pain with pull-ups, curls, or reaching behind</p>\n<p>• May interrupt sleep if lying on the shoulder</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>• Rest and activity modification</p>\n<p>• Anti-inflammatory medications (NSAIDs)</p>\n<p>• Physical therapy for shoulder mechanics</p>\n<p>• Corticosteroid injection around the tendon</p>\n<p>• Ice after activity</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>• Biceps tenodesis (relocate and anchor the tendon)</p>\n<p>• Biceps tenotomy (release the tendon)</p>\n<p>• Often done alongside rotator cuff repair</p>\n<p>• Tenodesis preferred in active/younger patients</p>\n<p>• Recovery: 3-4 months</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: What is the difference between tenodesis and tenotomy?</h3>\n<blockquote>\n<p>Tenodesis detaches the biceps from inside the joint and re-anchors it to the upper arm bone, preserving cosmetic appearance and strength. Tenotomy simply releases the tendon. Tenodesis is preferred for active patients.</p>\n</blockquote>\n<h3>Q: Will the pain go away without surgery?</h3>\n<blockquote>\n<p>Many patients improve significantly with therapy and injections. Surgery is reserved for cases that do not respond after several months of conservative treatment.</p>\n</blockquote>\n<h3>Q: Is biceps tendinitis related to my rotator cuff?</h3>\n<blockquote>\n<p>Often, yes. The biceps tendon shares space with the rotator cuff, and inflammation in one frequently affects the other. Your surgeon will evaluate both during treatment.</p>\n</blockquote>\n<h3>Q: Can I still exercise?</h3>\n<blockquote>\n<p>Yes, but you may need to modify overhead and heavy curling movements temporarily. Your therapist will guide appropriate activity levels.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_slap": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">SLAP Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the labrum at the top of the shoulder socket (where biceps attaches)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Overhead athletes, heavy lifters, and adults from falls or repetitive use</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Deep shoulder pain with catching, popping, or instability</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI arthrogram to view labrum and biceps anchor</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Arthroscopic repair or biceps tenodesis depending on tear and age</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>SLAP stands for Superior Labrum Anterior to Posterior. The labrum is a ring of cartilage that deepens the shoulder socket and anchors the biceps tendon. Tears occur from repetitive overhead motion (throwing, swimming, weightlifting), acute trauma (falling on an outstretched arm), or natural aging. The labrum weakens with age, making tears over 40 increasingly common.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Deep pain with overhead movement</p>\n<p>• Pain with lifting or throwing</p>\n<p>• Aching after activity</p>\n<p>• Night pain in some cases</p></td>\n<td><h3>Function</h3>\n<p>• Catching, popping, or grinding</p>\n<p>• Shoulder feeling unstable or \"slipping\"</p>\n<p>• Decreased strength</p>\n<p>• Loss of throwing velocity (athletes)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Start Here)</h3>\n<p>• Rest and activity modification</p>\n<p>• Anti-inflammatory medications</p>\n<p>• Physical therapy for stability</p>\n<p>• Corticosteroid injection for pain relief</p></td>\n<td><h3>Surgical (When Conservative Fails)</h3>\n<p>• Arthroscopic labral repair (reattach labrum)</p>\n<p>• Biceps tenodesis (relocate biceps anchor)</p>\n<p>• Tenodesis often preferred for patients &gt;35-40</p>\n<p>• Recovery: 4-6 months depending on procedure</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: What is the difference between a repair and a tenodesis?</h3>\n<blockquote>\n<p>A repair reattaches the torn labrum to the bone. A tenodesis detaches the biceps from the labrum and re-anchors it lower on the arm. Tenodesis is often preferred in patients over 35-40 because the labrum becomes less reliable with age.</p>\n</blockquote>\n<h3>Q: Can I return to overhead sports after surgery?</h3>\n<blockquote>\n<p>Many patients return to sports. Recovery takes 4-6 months with dedicated physical therapy. Throwing athletes may take longer to regain full velocity.</p>\n</blockquote>\n<h3>Q: Do all SLAP tears need surgery?</h3>\n<blockquote>\n<p>No. Many SLAP tears, especially in older patients, respond well to therapy and activity modification. Surgery is reserved for cases that don't improve with conservative care.</p>\n</blockquote>\n<h3>Q: What is the difference between a SLAP tear and a rotator cuff tear?</h3>\n<blockquote>\n<p>They are different structures. The labrum is the cartilage ring around the socket; the rotator cuff is a group of tendons on the ball. Both can cause shoulder pain but require different treatments.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_adcap": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Frozen Shoulder (Adhesive Capsulitis)</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Inflammation and tightening of the shoulder capsule causing stiffness and pain</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Ages 40-60, more common in women, diabetics, thyroid patients</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Progressive loss of shoulder motion in all directions</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam showing restricted active and passive motion</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or manipulation/arthroscopic release</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Frozen Shoulder</h3>\n<p>The shoulder joint is surrounded by a flexible capsule that allows a wide range of motion. In frozen shoulder, this capsule becomes inflamed, thickened, and tight, severely limiting movement. The condition typically progresses through three distinct stages over 12-18 months and often resolves on its own, though recovery can take up to 2-3 years without treatment.</p>\n<h3>The Three Stages</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Freezing Stage (2-9 months)</h3>\n<p>• Gradual onset of shoulder pain</p>\n<p>• Pain often worse at night</p>\n<p>• Slow, progressive loss of motion</p>\n<p>• Pain precedes stiffness</p></td>\n<td><h3>Frozen Stage (4-12 months)</h3>\n<p>• Stiffness is the dominant problem</p>\n<p>• Pain may actually decrease</p>\n<p>• Significant loss of external rotation, flexion, IR</p>\n<p>• Daily activities become very difficult</p></td>\n</tr>\n</tbody>\n</table>\n<p>Thawing Stage (5-24 months): Motion gradually returns. The shoulder slowly loosens, and most patients recover a functional range of motion. Full recovery can take 1-3 years from onset.</p>\n<h3>Risk Factors</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Medical Conditions</h3>\n<p>• Diabetes (2-4x higher risk)</p>\n<p>• Thyroid disorders (hypo- or hyperthyroidism)</p>\n<p>• Cardiac disease or recent cardiac surgery</p>\n<p>• Autoimmune conditions</p></td>\n<td><h3>Other Factors</h3>\n<p>• Age 40-60 years</p>\n<p>• Female sex</p>\n<p>• Prolonged immobilization (sling, cast, post-surgery)</p>\n<p>• Previous frozen shoulder (risk of other side)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>The goal of treatment is to reduce pain and restore motion as quickly as possible. Most patients improve with non-surgical treatment, though the timeline can be long. More aggressive interventions are considered when progress stalls or symptoms are severely limiting daily function.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>• Physical therapy (gentle stretching within pain tolerance)</p>\n<p>• Oral anti-inflammatory medications</p>\n<p>• Corticosteroid injection into the joint</p>\n<p>• Hydrodilatation (saline expansion of the capsule)</p>\n<p>• Home stretching program (most important factor)</p></td>\n<td><h3>Surgical</h3>\n<p>• Manipulation under anesthesia (MUA)</p>\n<p>• Arthroscopic capsular release</p>\n<p>• Often combined: MUA followed by arthroscopic release</p>\n<p>• Aggressive PT begins immediately after procedure</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will frozen shoulder go away on its own?</h3>\n<blockquote>\n<p>In most cases, yes, but it can take 1-3 years. Treatment aims to speed up recovery and reduce the severity of symptoms during that time. Some patients retain mild stiffness permanently.</p>\n</blockquote>\n<h3>Q: Can I make it worse by stretching?</h3>\n<blockquote>\n<p>Gentle, consistent stretching is the cornerstone of treatment. However, aggressive or painful stretching can increase inflammation. Work within a tolerable discomfort level. Your therapist will guide appropriate intensity.</p>\n</blockquote>\n<h3>Q: I have diabetes. Does that affect my recovery?</h3>\n<blockquote>\n<p>Diabetic patients tend to have more severe and longer-lasting frozen shoulder. Blood sugar control is important for recovery. Your treatment may need to be more aggressive, and the timeline for improvement may be longer.</p>\n</blockquote>\n<h3>Q: Will it happen in my other shoulder?</h3>\n<blockquote>\n<p>About 20-30% of patients develop frozen shoulder in the opposite shoulder, typically within 5 years. Staying active and maintaining shoulder mobility can help reduce this risk.</p>\n</blockquote>\n<h3>Q: When should I consider surgery?</h3>\n<blockquote>\n<p>If 3-6 months of consistent physical therapy and injections have not improved your motion significantly, manipulation under anesthesia or arthroscopic capsular release may be recommended.</p>\n</blockquote>\n<h3>Q: What is manipulation under anesthesia?</h3>\n<blockquote>\n<p>While you are under general anesthesia, your surgeon gently moves your shoulder through its full range of motion, breaking up the scar tissue and adhesions in the capsule. This is often combined with an arthroscopic capsular release for the best results. Aggressive physical therapy starts immediately after the procedure to maintain the motion gained.</p>\n</blockquote>\n<h3>Q: Can I prevent frozen shoulder?</h3>\n<blockquote>\n<p>There is no guaranteed way to prevent it, but maintaining shoulder mobility is key. If you have a shoulder injury or surgery, begin gentle range-of-motion exercises as soon as your surgeon allows. If you have diabetes or thyroid disease, managing these conditions may reduce your risk.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_instab": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Instability / Labral Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the labrum at the front of the shoulder socket</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Young athletes, contact sports players, and those with shoulder dislocations</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Recurrent instability, feeling the shoulder will \"slip out\"</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI arthrogram to view labral damage</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Arthroscopic Bankart repair to reattach the labrum</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Develops</h3>\n<p>The labrum is a ring of cartilage that deepens the shoulder socket and helps keep the ball (humeral head) centered. When the shoulder dislocates or subluxates (partially slips out), the labrum tears away from the front of the socket. This is called a Bankart lesion. Once torn, the labrum often cannot heal on its own, leaving the shoulder prone to repeated episodes of instability.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain &amp; Instability</h3>\n<p>• Shoulder feels loose or \"dead arm\"</p>\n<p>• Fear or apprehension with overhead motions</p>\n<p>• Pain with reaching behind or to the side</p>\n<p>• Recurrent dislocations or subluxations</p></td>\n<td><h3>Function</h3>\n<p>• Weakness with throwing or overhead activity</p>\n<p>• Catching or locking in certain positions</p>\n<p>• Difficulty sleeping on the affected side</p>\n<p>• Loss of confidence in the shoulder</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (First-Time or Mild)</h3>\n<p>• Physical therapy to strengthen stabilizers</p>\n<p>• Activity modification</p>\n<p>• Bracing during sports (temporary)</p>\n<p>• Appropriate for some first-time dislocations</p></td>\n<td><h3>Surgical (Recurrent Instability)</h3>\n<p>• Arthroscopic Bankart repair</p>\n<p>• Labrum reattached with suture anchors</p>\n<p>• High success rate for preventing re-dislocation</p>\n<p>• Recovery: 4-6 months for full return to sports</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder keep dislocating without surgery?</h3>\n<blockquote>\n<p>If you have had multiple dislocations, the risk of recurrence is high without surgical repair, especially in younger patients.</p>\n</blockquote>\n<h3>Q: Can I return to contact sports after repair?</h3>\n<blockquote>\n<p>Yes. Most athletes return to full contact sports at 4-6 months. The repaired labrum is typically stronger than the torn state.</p>\n</blockquote>\n<h3>Q: What if I only dislocated once?</h3>\n<blockquote>\n<p>First-time dislocations in patients over 30 may respond to therapy alone. Younger patients and athletes have higher recurrence rates and may benefit from earlier repair.</p>\n</blockquote>\n<h3>Q: How long will I be in a sling?</h3>\n<blockquote>\n<p>Typically 4-6 weeks, followed by gradual range of motion exercises guided by your physical therapist.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "c_db": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Distal Biceps Tear</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>Tear of the biceps tendon where it attaches to the forearm (radius bone)</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Men 30-60, often from heavy lifting or sudden eccentric load</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Sudden pop at the elbow, pain, bruising, and visible biceps retraction</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam (hook test) + MRI to confirm tear extent</td>\n</tr>\n<tr>\n<td><strong>Surgical Option</strong></td>\n<td>Surgical reattachment recommended within 2-3 weeks of injury</td>\n</tr>\n</tbody>\n</table>\n<h3>How It Happens</h3>\n<p>The distal biceps tendon connects your biceps muscle to the radius bone near the elbow. A tear typically occurs when a heavy load is applied to the arm while the elbow is bent (such as catching a heavy object or lifting with an unexpected jerk). Most tears are complete, meaning the tendon pulls entirely off the bone. You may hear or feel a \"pop\" and notice the biceps muscle bunch up toward the shoulder.</p>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Immediate (After Injury)</h3>\n<p>• Sudden sharp pain at the front of the elbow</p>\n<p>• Audible or palpable pop</p>\n<p>• Swelling and bruising in the forearm</p>\n<p>• Visible deformity (\"Popeye\" sign in the upper arm)</p></td>\n<td><h3>Ongoing (If Untreated)</h3>\n<p>• Weakness turning the forearm (supination)</p>\n<p>• 30-40% loss of supination strength</p>\n<p>• Cramping with repetitive arm use</p>\n<p>• Persistent biceps deformity</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical (Select Cases)</h3>\n<p>• May be appropriate for low-demand, older patients</p>\n<p>• Accepts permanent loss of supination strength</p>\n<p>• Physical therapy to maximize remaining function</p>\n<p>• Does not restore full anatomy</p></td>\n<td><h3>Surgical (Recommended for Most)</h3>\n<p>• Reattachment of tendon to the radius bone</p>\n<p>• Best results within 2-3 weeks of injury</p>\n<p>• Restores supination and flexion strength</p>\n<p>• Return to full activity at 4-6 months</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Is surgery urgent?</h3>\n<blockquote>\n<p>Ideally within 2-3 weeks. After that, the tendon retracts and scarring makes repair more difficult. If you suspect a tear, see your surgeon promptly.</p>\n</blockquote>\n<h3>Q: What strength do I lose without surgery?</h3>\n<blockquote>\n<p>Approximately 30-40% of forearm rotation (supination) strength and 10-20% of elbow flexion strength. This matters for tasks like using a screwdriver, opening jars, and lifting.</p>\n</blockquote>\n<h3>Q: When can I return to lifting?</h3>\n<blockquote>\n<p>Light activity at 3 months, full lifting at 5-6 months. Early overuse risks re-rupture.</p>\n</blockquote>\n<h3>Q: Will I have a scar?</h3>\n<blockquote>\n<p>Yes, a small incision at the front of the elbow, typically 2-3 inches. It fades well over time.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_tsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Total Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Damaged joint surfaces replaced with metal and plastic implants</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1-2 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home the same day</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>25-30 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>Shoulder arthritis causes cartilage to wear down, leading to bone-on-bone contact, pain, and stiffness. When conservative treatments (therapy, injections, medications) no longer provide relief, Total Shoulder Replacement (TSA) restores smooth, pain-free motion by replacing the damaged ball and socket with artificial implants.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 25-30 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;25-30 lbs overhead), high-impact sports, and activities that risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Risks</h3>\n<p>Complications are rare but may include: infection, stiffness, implant loosening or wear over time, fractures around the implant, or incomplete pain relief. The benefits far outweigh the risks for most patients.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain 80% or more of their normal function with significant pain relief.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins within days of surgery and continues for 3-4 months to restore strength and motion.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do’s and Don’ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>✅ DO</strong></td>\n<td><strong>❌ DON’T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_rsa": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Reverse Shoulder Replacement</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div>\n<p>Robert H. Rolf, M.D. | Beacon Orthopaedics &amp; Sports Medicine</p>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Procedure</strong></td>\n<td>Ball and socket reversed so the deltoid muscle powers the arm</td>\n</tr>\n<tr>\n<td><strong>Surgery Time</strong></td>\n<td>Approximately 1.5-2.5 hours</td>\n</tr>\n<tr>\n<td><strong>Same Day?</strong></td>\n<td>Most patients go home same day; overnight if needed</td>\n</tr>\n<tr>\n<td><strong>Sling</strong></td>\n<td>2-4 weeks</td>\n</tr>\n<tr>\n<td><strong>Lifetime Limit</strong></td>\n<td>10-15 lbs overhead</td>\n</tr>\n<tr>\n<td><strong>Return to Sports</strong></td>\n<td>Golf, swimming, tennis at 4-6 months</td>\n</tr>\n</tbody>\n</table>\n<h3>Why Consider Surgery?</h3>\n<p>When the rotator cuff is severely torn and not repairable, the shoulder loses stability and develops arthritis. A Reverse Shoulder Replacement flips the normal anatomy, placing a ball where the socket was and vice versa, allowing the deltoid muscle to compensate for the missing rotator cuff. <strong>Common reasons:</strong> irreparable cuff tear with arthritis, failed previous replacement, complex fractures, severe arthritis with instability.</p>\n<p><strong>How is this different from a standard replacement?</strong> A standard replacement requires a functioning rotator cuff. A reverse swaps the ball and socket, allowing the deltoid to power the arm when the cuff is too damaged to repair.</p>\n<h3>Recovery Timeline</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Phase</strong></td>\n<td><strong>Timeframe</strong></td>\n<td><strong>What to Expect</strong></td>\n</tr>\n<tr>\n<td>Immediate</td>\n<td>Day 1</td>\n<td>Begin gentle movement with physical therapist</td>\n</tr>\n<tr>\n<td>Protection</td>\n<td>Weeks 1-4</td>\n<td>Wear sling for comfort and protection</td>\n</tr>\n<tr>\n<td>Early Rehab</td>\n<td>Weeks 4-12</td>\n<td>Increase movement gradually; 5-lb lifting limit</td>\n</tr>\n<tr>\n<td>Strengthening</td>\n<td>Months 4-6</td>\n<td>Return to swimming, golf, tennis; 10-lb limit</td>\n</tr>\n<tr>\n<td>Long-Term</td>\n<td>6+ months</td>\n<td>Most function restored; 10-15 lb overhead limit</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><strong>Avoid heavy lifting (&gt;10-15 lbs overhead), high-impact sports, and activities that risk falls.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Longevity &amp; Risks</h3>\n<p>91-94% of implants survive 10+ years; 84-87% at 15 years. Rare risks include: infection, dislocation, nerve injury, component loosening, acromion fracture, or revision surgery.</p>\n<h3>Frequently Asked Questions</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Q: Will my shoulder feel normal?</h3>\n<blockquote>\n<p>Most patients regain significant function and pain relief. The deltoid does the work the rotator cuff no longer can.</p>\n</blockquote>\n<h3>Q: When can I drive?</h3>\n<blockquote>\n<p>Once you can safely control the vehicle and are no longer taking narcotic pain medication.</p>\n</blockquote>\n<h3>Q: Can I return to sports?</h3>\n<blockquote>\n<p>Golf, swimming, and tennis typically resume at 4-6 months. Avoid contact sports and heavy weightlifting.</p>\n</blockquote>\n<h3>Q: Will I need physical therapy?</h3>\n<blockquote>\n<p>Yes. PT begins 2-3 days after surgery and continues for 3-4 months.</p>\n</blockquote></td>\n</tr>\n</tbody>\n</table>\n<h3>First 4 Weeks: Do’s and Don’ts</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>✅ DO</strong></td>\n<td><strong>❌ DON’T</strong></td>\n</tr>\n<tr>\n<td>Ice your shoulder 20 min on / 20 min off</td>\n<td>Lift anything with your surgical arm</td>\n</tr>\n<tr>\n<td>Sleep elevated or in a recliner</td>\n<td>Reach behind your back</td>\n</tr>\n<tr>\n<td>Take medications on schedule</td>\n<td>Push or pull with the surgical arm</td>\n</tr>\n<tr>\n<td>Wear your sling as instructed</td>\n<td>Remove your sling without instructions</td>\n</tr>\n<tr>\n<td>Begin PT exercises as directed</td>\n<td>Drive until cleared</td>\n</tr>\n<tr>\n<td>Use the opposite arm for daily tasks</td>\n<td>Submerge incision in water (no pools/baths)</td>\n</tr>\n</tbody>\n</table>\n<table>\n\n<tbody>\n<tr>\n<td><p><strong>myMobility</strong> with Zimmer Biomet</p>\n<p>Dr. Rolf uses the myMobility app by Zimmer Biomet for all shoulder replacement patients during the first year after surgery. This app allows our team to monitor your recovery progress, track outcomes, and provide guided exercises and education directly to your phone or tablet. You will receive setup instructions before your procedure.</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Questions? 513-354-3700 | teamrolf@beaconortho.com | www.DoctorRolf.com</h3>\n<p><em>Refs: Grubhofer et al. JSES 2016. Young et al. JBJS 2020. Smith et al. JSES 2024.</em></p>\n", "sh_rcr": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Rotator Cuff Repair</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><table>\n\n<tbody>\n<tr>\n<td><strong>What Is It?</strong></td>\n<td>A partial or complete tear of one or more rotator cuff tendons</td>\n</tr>\n<tr>\n<td><strong>Who Gets It?</strong></td>\n<td>Adults over 40 (degenerative), athletes/laborers (traumatic)</td>\n</tr>\n<tr>\n<td><strong>Key Symptom</strong></td>\n<td>Pain with overhead reaching, weakness lifting the arm</td>\n</tr>\n<tr>\n<td><strong>Diagnosis</strong></td>\n<td>Physical exam + MRI to determine tear size and location</td>\n</tr>\n<tr>\n<td><strong>Treatment</strong></td>\n<td>Physical therapy, injections, or arthroscopic surgical repair</td>\n</tr>\n</tbody>\n</table>\n<h3>Understanding Your Rotator Cuff</h3>\n<p>The rotator cuff is a group of four muscles and tendons that surround the shoulder joint: the supraspinatus, infraspinatus, teres minor, and subscapularis. Together they stabilize the ball in the socket and allow you to lift and rotate your arm. When one or more of these tendons tears, it can cause significant pain and weakness. Tears range from partial-thickness (a fraying of the tendon) to full-thickness (a complete tear through the tendon).</p>\n<h3>Types of Rotator Cuff Tears</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>By Cause</h3>\n<p>• Degenerative: gradual wear over time (most common)</p>\n<p>• Traumatic: from a fall, lifting, or sudden injury</p>\n<p>• Overuse: repetitive overhead work or sport</p></td>\n<td><h3>By Severity</h3>\n<p>• Partial-thickness: tendon is damaged but not torn through</p>\n<p>• Full-thickness (small): &lt;1 cm tear</p>\n<p>• Full-thickness (large): 1-3 cm tear</p>\n<p>• Massive: &gt;3 cm or involves multiple tendons</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Common Symptoms</h3>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Pain</h3>\n<p>• Aching at the top or side of the shoulder</p>\n<p>• Pain worse at night, especially lying on that side</p>\n<p>• Sharp pain with overhead motions</p>\n<p>• Gradual or sudden onset depending on cause</p></td>\n<td><h3>Function</h3>\n<p>• Weakness lifting or rotating the arm</p>\n<p>• Difficulty reaching behind back (bra strap, belt)</p>\n<p>• Arm feels heavy or fatigued</p>\n<p>• Crackling or popping sensation with movement</p></td>\n</tr>\n</tbody>\n</table>\n<h3>Treatment Options</h3>\n<p>Not all rotator cuff tears require surgery. Many partial tears and even some full-thickness tears can be managed successfully with physical therapy, activity modification, and anti-inflammatory measures. Your surgeon will consider the tear size, your activity level, symptom severity, and how long the tear has been present when recommending treatment.</p>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Non-Surgical</h3>\n<p>• Physical therapy to strengthen surrounding muscles</p>\n<p>• Anti-inflammatory medications (oral or topical)</p>\n<p>• Cortisone injection for pain relief</p>\n<p>• Activity modification and ergonomic adjustments</p></td>\n<td><h3>Surgical</h3>\n<p>• Arthroscopic rotator cuff repair (most common)</p>\n<p>• Mini-open repair for larger tears</p>\n<p>• Tendon transfer or superior capsular reconstruction</p>\n<p>• Reverse shoulder replacement (massive irreparable tears)</p></td>\n</tr>\n</tbody>\n</table>\n<h3>After Surgery: What to Expect</h3>\n<p>If surgery is recommended, you will wear a sling for approximately 6 weeks while the repaired tendon heals. Physical therapy begins soon after surgery with gentle passive motion, progressing to active motion around 6 weeks and strengthening around 12 weeks. Most patients return to full activity by 5-6 months, though large or massive tears may take longer. Your specific restrictions will be: 5 lb lifting limit at 6 weeks, 10 lb at 3 months, with no restrictions after 6 months for small and medium tears.</p>\n<h3>Frequently Asked Questions</h3>\n<h3>Q: Will my tear get bigger if I don't have surgery?</h3>\n<blockquote>\n<p>It depends. Some tears remain stable for years, while others may enlarge over time, especially with continued heavy use. Your surgeon can help you weigh the risks of waiting versus repairing the tear.</p>\n</blockquote>\n<h3>Q: Can a torn rotator cuff heal on its own?</h3>\n<blockquote>\n<p>Partial tears can sometimes improve with rest and therapy, but full-thickness tears generally do not heal without surgical repair. The tendon edges retract and the muscle can develop fatty changes over time.</p>\n</blockquote>\n<h3>Q: How long will I be out of work?</h3>\n<blockquote>\n<p>Desk work: 1-2 weeks after surgery. Light physical work: 3-4 months. Heavy labor or overhead work: 5-6 months. Your surgeon will provide specific work restriction documentation.</p>\n</blockquote>\n<h3>Q: What if I don't have surgery?</h3>\n<blockquote>\n<p>Many patients do well with physical therapy alone, especially with partial tears or lower activity demands. However, if the tear is causing significant pain or weakness that limits your daily life, surgery may be the best option for long-term improvement.</p>\n</blockquote>\n<h3>Q: What happens if a tear goes untreated for a long time?</h3>\n<blockquote>\n<p>Over time, an untreated tear can enlarge, and the rotator cuff muscle can develop fatty infiltration and atrophy. Once these changes become severe, the tear may no longer be repairable with standard techniques. This is why monitoring with your surgeon is important, even if you choose not to have surgery right away.</p>\n</blockquote>\n<h3>Q: When can I return to sports or recreational activities?</h3>\n<blockquote>\n<p>Low-impact activities like walking or stationary biking can begin within a few weeks of surgery. Golf and swimming typically resume around 4-5 months. Full contact or overhead sports require 6 months and surgeon clearance. Your recovery tracker will provide specific milestones.</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n", "sh_faq": "<div class=\"hp-head\"><div class=\"hp-practice\">Beacon Orthopaedics</div><div class=\"hp-title\">Shoulder Surgery FAQ</div><div class=\"hp-sub\">Robert H. Rolf, MD &mdash; Shoulder &amp; Elbow Surgery</div></div><h3>Frequently Asked Questions</h3>\n<p>About Shoulder Surgery</p>\n<h3>What Will My Restrictions Be After Surgery?</h3>\n<p>Your post-operative restrictions depend on the type of shoulder surgery performed. Follow these guidelines to ensure proper healing:</p>\n<h3>Rotator Cuff Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Total Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>25-30 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>Labral Repair</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-6 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>7-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>After 26 weeks</strong></td>\n<td>Cleared for normal activity</td>\n</tr>\n</tbody>\n</table>\n<h3>Reverse Shoulder Replacement</h3>\n<table>\n\n<tbody>\n<tr>\n<td><strong>0-4 weeks</strong></td>\n<td>Must wear a sling</td>\n</tr>\n<tr>\n<td><strong>6-12 weeks</strong></td>\n<td>5-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>13-26 weeks</strong></td>\n<td>10-pound lifting limit</td>\n</tr>\n<tr>\n<td><strong>Indefinite</strong></td>\n<td>10-15 lb overhead lifting limit</td>\n</tr>\n</tbody>\n</table>\n<h3>When Can I Return to Work?</h3>\n<blockquote>\n<p>• Most patients can return to work the week after surgery, depending on their job duties.</p>\n<p>• Review the post-operative restrictions above with your employer to determine when you can safely resume work.</p>\n<p>• If your employer requires work restriction notes, we can provide them via email or fax upon request.</p>\n<p>• If your job requires lifting beyond your restrictions, your employer may either keep you off work or modify your job duties accordingly.</p>\n</blockquote>\n<h3>Will I Need Physical Therapy After Surgery?</h3>\n<p>Yes, physical therapy is required for all shoulder surgery to ensure proper recovery.</p>\n<blockquote>\n<p>• <strong>First PT Visit:</strong> 2 days after surgery for a dressing change and incision check.</p>\n</blockquote>\n<h3>Shoulder Replacements:</h3>\n<blockquote>\n<p>• PT twice a week for 6 weeks.</p>\n<p>• Then transition to once a week or every other week until 3-4 months after surgery.</p>\n</blockquote>\n<h3>Shoulder Repairs:</h3>\n<blockquote>\n<p>• Attend initial PT visit.</p>\n<p>• Return in 2-4 weeks, depending on the extent of the repair.</p>\n<p>• Your therapy schedule will be outlined on your PT script, provided on the day of surgery.</p>\n</blockquote>\n<h3>When Can I Return to Golf After Shoulder Surgery?</h3>\n<p>Your return to golf will depend on the type of shoulder surgery performed and your progress in rehabilitation.</p>\n<h3>Rotator Cuff Repair</h3>\n<blockquote>\n<p>• <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>• <strong>Full swings:</strong> ~6 months</p>\n<p>• <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Total Shoulder Replacement</h3>\n<blockquote>\n<p>• <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>• <strong>Full swings:</strong> ~5-6 months</p>\n<p>• <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Labral Repair</h3>\n<blockquote>\n<p>• <strong>Chipping &amp; putting:</strong> ~4 months</p>\n<p>• <strong>Full swings:</strong> ~6 months</p>\n<p>• <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<h3>Reverse Shoulder Replacement</h3>\n<blockquote>\n<p>• <strong>Chipping &amp; putting:</strong> ~3-4 months</p>\n<p>• <strong>Full swings:</strong> ~5-6 months</p>\n<p>• <strong>Return to competitive play:</strong> ~6-9 months</p>\n</blockquote>\n<table>\n\n<tbody>\n<tr>\n<td><h3>Questions? Contact Us</h3>\n<p>Phone: 513-354-3700 | Email: teamrolf@beaconortho.com | www.DoctorRolf.com</p></td>\n</tr>\n</tbody>\n</table>\n"};</script>
